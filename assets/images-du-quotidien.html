<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images du quotidien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout : cahier d'écolier — grande image à gauche, 4 bandes de phrases lignées Seyès à droite, une colonne sur téléphone */
:root{
  --bg:#f3f6fb; --paper:#ffffff; --ink:#1d3b6e; --soft:#5d7090;
  --line:#c9d8ef; --margin:#e46a6a; --accent:#2f6fd6; --ok:#2f9a5b; --okbg:#e3f5ea; --bad:#d6453d; --badbg:#fbe7e5;
  --tile:#fffdf7; --l1:#2f9a5b; --l2:#e08a1e; --l3:#c2413a;
  --f-display:"Baloo 2","Trebuchet MS",sans-serif;
  --f-read:"Andika","Comic Sans MS",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b27; --paper:#1c2535; --ink:#e4ecfa; --soft:#9fb0cc; --line:#2d3b54; --margin:#c45a5a;
  --accent:#7aa7ff; --ok:#5fcf8d; --okbg:#1b3428; --bad:#ff7b72; --badbg:#3a1f22; --tile:#f4f1e8;
  --l1:#5fcf8d; --l2:#f0a94a; --l3:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b27; --paper:#1c2535; --ink:#e4ecfa; --soft:#9fb0cc; --line:#2d3b54; --margin:#c45a5a;
  --accent:#7aa7ff; --ok:#5fcf8d; --okbg:#1b3428; --bad:#ff7b72; --badbg:#3a1f22; --tile:#f4f1e8;
  --l1:#5fcf8d; --l2:#f0a94a; --l3:#ff7b72; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-read);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1;margin:0;text-wrap:balance}
.consigne{margin:6px 0 0;font-size:18px;color:var(--soft)}
.stats{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-display);font-size:18px}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.levels{grid-template-columns:minmax(0,1fr)}}
.lvl{appearance:none;font:inherit;color:var(--ink);cursor:pointer;background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-2px);border-color:var(--c)}
.lvl b{font-family:var(--f-display);font-size:24px;color:var(--c);display:flex;align-items:center;gap:8px}
.lvl .dots{display:inline-flex;gap:4px}.lvl .dots i{width:10px;height:10px;border-radius:50%;background:var(--c)}.lvl .dots i.off{background:var(--line)}
.lvl span{color:var(--soft);font-size:16px;line-height:1.35}
.lvl q{font-size:17px;quotes:none}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
.pic{background:var(--tile);border:3px solid var(--line);border-radius:18px;aspect-ratio:1;max-width:100%;overflow:hidden;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:80%;height:auto}
.phrases{display:flex;flex-direction:column;gap:12px}
.strip{display:flex;align-items:stretch;background:var(--paper);border:2px solid var(--line);border-radius:10px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 11px,var(--line) 11px 12px)}
.strip .say{appearance:none;border:0;border-right:2px solid var(--margin);background:transparent;color:var(--soft);
  width:52px;flex:none;cursor:pointer;display:grid;place-items:center}
.strip .say svg{width:24px;height:24px}
.strip .txt{appearance:none;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  flex:1;min-width:0;padding:12px 14px;font-size:clamp(19px,2.4vw,23px);line-height:1.35}
.strip.good{border-color:var(--ok);background-color:var(--okbg)}
.strip.wrong{border-color:var(--bad);background-color:var(--badbg)}
.strip.wrong .txt{text-decoration:line-through;color:var(--soft)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.lvl{transition:none}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.msg{font-family:var(--f-display);font-size:22px;min-height:1.4em;margin:0}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:18px;padding:8px 20px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#10192a}}
:root[data-theme="dark"] .btn:not(.ghost){color:#10192a}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.end{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.end h2{font-family:var(--f-display);margin:0;font-size:30px}
.end p{margin:0;font-size:19px}
.foot{font-size:14px;color:var(--soft)}
</style>
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Images du quotidien</h1>
      <p class="consigne" id="consigne">Choisis un niveau.</p>
    </div>
    <div class="stats" id="stats" hidden>
      <span class="pill" id="niv">Niveau 1</span>
      <span class="pill" id="prog">Image 1 / 24</span>
      <span class="pill" id="score">0 ★</span>
    </div>
  </header>

  <section id="menu" class="levels">
    <button type="button" class="lvl" data-l="0" style="--c:var(--l1)"><b><span class="dots"><i></i><i class="off"></i><i class="off"></i></span>Niveau 1</b><span>Phrases courtes. Les pièges sont très différents.</span><q>« Je fais du vélo. »</q></button>
    <button type="button" class="lvl" data-l="1" style="--c:var(--l2)"><b><span class="dots"><i></i><i></i><i class="off"></i></span>Niveau 2</b><span>Phrases moyennes. Les pièges se ressemblent un peu.</span><q>« Mon vélo rouge a deux roues. »</q></button>
    <button type="button" class="lvl" data-l="2" style="--c:var(--l3)"><b><span class="dots"><i></i><i></i><i></i></span>Niveau 3</b><span>Phrases longues. Un seul mot change : lis bien jusqu'au bout.</span><q>« Mon vélo rouge a deux roues et une selle noire. »</q></button>
  </section>

  <section id="game" hidden>
    <div class="board">
      <div class="pic" id="pic"></div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="phrases" id="phrases"></div>
        <div class="actions">
          <p class="msg" id="msg" aria-live="polite"></p>
          <button type="button" class="btn" id="next" hidden>Image suivante</button>
        </div>
      </div>
    </div>
  </section>

  <section id="end" class="end" hidden>
    <h2 id="endTitle">Bravo !</h2>
    <p id="endTxt"></p>
    <div class="actions" style="justify-content:flex-start">
      <button type="button" class="btn" id="again">Rejouer ce niveau</button>
      <button type="button" class="btn ghost" id="toMenu">Changer de niveau</button>
    </div>
  </section>

  <div class="actions foot">
    <span>Le haut-parleur lit la phrase. Une étoile quand la bonne phrase est trouvée du premier coup.</span>
    <button type="button" class="btn ghost" id="quit" hidden>Changer de niveau</button>
  </div>
</div>

ot de bain.", "À la plage, la fille dort sur le sable en maillot de bain."]], [["Le garçon joue.", "Le garçon pleure.", "Le garçon dort.", "Le garçon lit."], ["Le garçon joue avec un pistolet à eau.", "Le garçon joue avec un ballon.", "Le garçon joue avec un cerf-volant.", "Le garçon arrose avec un tuyau."], ["Dans le jardin, le garçon lève son pistolet à eau en souriant.", "Dans le jardin, le garçon lève son pistolet à eau en pleurant.", "Dans le jardin, le garçon pose son pistolet à eau en souriant.", "Dans la classe, le garçon lève son pistolet à eau en souriant."]], [["La fille est contente.", "La fille est triste.", "La fille est fatiguée.", "La fille est en colère."], ["La fille lève les bras dans la classe.", "La fille lève la main dans la classe.", "La fille lève les bras dans le jardin.", "La fille croise les bras dans la classe."], ["Avec son sac rose sur le dos, la fille crie de joie dans la classe.", "Avec son sac bleu sur le dos, la fille crie de joie dans la classe.", "Avec son sac rose sur le dos, la fille pleure dans la classe.", "Avec son sac rose à la main, la fille crie de joie dans la cour."]], [["La fille a des fleurs.", "La fille a un chien.", "La fille a un ballon.", "La fille a un gâteau."], ["La fille tient un bouquet de fleurs.", "La fille tient un panier de fruits.", "La fille cueille des fleurs.", "La fille tient un bouquet de ballons."], ["Pour la rentrée, la fille porte une blouse noire et tient des fleurs.", "Pour la rentrée, la fille porte une blouse blanche et tient des fleurs.", "Pour la rentrée, la fille porte une blouse noire et tient un livre.", "Pour son anniversaire, la fille porte une robe rose et tient des fleurs."]], [["La fille a un sac.", "La fille a un vélo.", "La fille a un chat.", "La fille a une pomme."], ["La fille porte un gros sac à dos.", "La fille porte un petit sac à main.", "La fille porte une grosse valise.", "Le garçon porte un gros sac à dos."], ["La fille sourit, elle a des livres dans les bras et un sac sur ITEMS.forEach((it,i)=>it.lv=LEVELS[i]);

const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

let level=0,order=[],pos=0,stars=0,tries=0,solved=false;
function show(view){["menu","game","end"].forEach(v=>$(v).hidden=v!==view);$("stats").hidden=view==="menu";$("quit").hidden=view!=="game";
  $("consigne").textContent=view==="menu"?"Choisis un niveau.":view==="game"?"Regarde l'image et choisis la bonne phrase.":"Partie terminée.";}
function start(l){level=l;order=shuffle(ITEMS.map((_,i)=>i));pos=0;stars=0;show("game");$("niv").textContent=`Niveau ${l+1}`;draw();}
function draw(){
  const it=ITEMS[order[pos]], set=it.lv[level];
  tries=0;solved=false;
  $("pic").innerHTML=it.img?`<img src="${it.img}" alt="Image à décrire">`:`<svg viewBox="0 0 100 100" role="img" aria-label="Image à décrire">${it.svg}</svg>`;
  $("phrases").innerHTML=shuffle(set.map((p,k)=>({p,k}))).map(o=>`<div class="strip" data-k="${o.k}"><button type="button" class="say" aria-label="Écouter la phrase">${SPK}</button><button type="button" class="txt">${o.p}</button></div>`).join("");
  $("prog").textContent=`Image ${pos+1} / ${ITEMS.length}`;
  $("score").textContent=`${stars} ★`;
  $("msg").textContent="";$("msg").className="msg";$("next").hidden=true;
}
$("phrases").addEventListener("click",e=>{
  const s=e.target.closest(".strip");if(!s)return;
  const k=+s.dataset.k, set=ITEMS[order[pos]].lv[level];
  if(e.target.closest(".say")){say(set[k]);return}
  if(solved||s.classList.contains("wrong"))return;
  tries++;
  if(k===0){
    solved=true;s.classList.add("good");
    if(tries===1){stars++;$("score").textContent=`${stars} ★`}
    $("msg").textContent=tries===1?"Bravo, du premier coup !":"Oui, c'est la bonne phrase.";$("msg").className="msg ok";
    $("next").textContent=pos>=ITEMS.length-1?"Voir le résultat":"Image suivante";$("next").hidden=false;$("next").focus();
  }else{
    s.classList.add("wrong","shake");setTimeout(()=>s.classList.remove("shake"),450);
    $("msg").textContent="Pas cette phrase. Relis bien.";$("msg").className="msg no";
  }
});
$("next").addEventListener("click",()=>{
  if(pos>=ITEMS.length-1){
    show("end");
    $("endTitle").textContent=stars>=ITEMS.length*.8?"Bravo !":stars>=ITEMS.length*.5?"Bien joué !":"Continue, tu progresses !";
    $("endTxt").textContent=`Niveau ${level+1} : ${stars} image${stars>1?"s":""} sur ${ITEMS.length} trouvée${stars>1?"s":""} du premier coup.`;
  }else{pos++;draw();}
  window.scrollTo({top:0,behavior:"smooth"});
});
document.querySelectorAll(".lvl").forEach(b=>b.addEventListener("click",()=>start(+b.dataset.l)));
$("again").addEventListener("click",()=>start(level));
$("toMenu").addEventListener("click",()=>show("menu"));
$("quit").addEventListener("click",()=>show("menu"));
show("menu");
</script>
