<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les explorateurs du cerveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#f7d6e0; --rose-f:#c2577a; --violet:#5b3f8c; --violet-c:#ece4fb;
  --or:#f4b62a; --or-f:#b9800a; --vert:#2e9d63; --vert-f:#1d6b42; --rouge:#d9534f;
  --encre:#2d2440; --carte:#fffdf8; --ombre:0 8px 22px rgba(60,30,80,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Andika",system-ui,sans-serif;color:var(--encre);background:#3b2a5c;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:"Baloo 2","Andika",sans-serif;line-height:1.1}
.ecran{position:fixed;inset:0;display:none}
.ecran.actif{display:block}

/* Fond : le cerveau */
.fond{position:absolute;inset:0;background:url(/images/cerveau/decor.jpg) center/cover no-repeat}
.fond.flou{filter:blur(3px) brightness(.75);transform:scale(1.03)}

/* Boutons */
.btn{background:var(--or);color:#3a2600;border:0;border-radius:16px;padding:12px 24px;font-size:clamp(17px,2.4vw,22px);font-weight:700;box-shadow:0 5px 0 var(--or-f)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--or-f)}
.btn:disabled{opacity:.45;cursor:default}
.btn.vert{background:var(--vert);color:#fff;box-shadow:0 5px 0 var(--vert-f)}
.btn.violet{background:var(--violet);color:#fff;box-shadow:0 5px 0 #392559}
.btn.petit{font-size:16px;padding:8px 14px}
.son{background:#fff;border:2px solid var(--violet-c);border-radius:50%;width:44px;height:44px;font-size:20px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.son:focus-visible,.btn:focus-visible,.choix:focus-visible,.case:focus-visible,.perso:focus-visible,.balise:focus-visible{outline:4px solid #4fa3ff;outline-offset:3px}

/* Carte (panneau) */
.panneau{position:relative;margin:auto;background:var(--carte);border-radius:24px;box-shadow:var(--ombre);border:4px solid #fff;padding:clamp(14px,3vw,28px);width:min(860px,94vw);max-height:calc(100vh - 28px);overflow:auto}
.centrer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}

/* Accueil */
#accueil h1{text-align:center;color:var(--violet);font-size:clamp(30px,6vw,52px);margin:0 0 4px}
#accueil .sous{text-align:center;font-size:clamp(16px,2.4vw,20px);margin:0 0 14px}
.persos{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
.perso{background:#fff;border:5px solid #eee;border-radius:20px;padding:8px 8px 10px;width:min(190px,40vw);font-size:19px;font-weight:700;box-shadow:var(--ombre)}
.perso img{width:100%;height:min(220px,30vh);object-fit:contain;display:block}
.perso[aria-pressed=true]{border-color:var(--or);background:#fff6dc}
.ligne{display:flex;align-items:center;gap:10px;justify-content:center}

/* Carte du cerveau */
.scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:url(/images/cerveau/decor.jpg) center/100% 100% no-repeat}
.balise{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.balise .rond{width:clamp(38px,5.5vw,64px);height:clamp(38px,5.5vw,64px);border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:clamp(18px,2.6vw,30px);background:#fff;color:var(--violet);border:4px solid var(--violet);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.balise .nom{background:rgba(45,36,64,.85);color:#fff;border-radius:10px;padding:2px 8px;font-size:clamp(11px,1.4vw,15px);font-weight:700;white-space:nowrap}
.balise.fermee .rond{background:#d9d3e4;color:#8a809c;border-color:#8a809c}
.balise.fermee .rond::after{content:"🔒";font-size:.6em;position:absolute;margin:-1.4em 0 0 1.4em}
.balise.faite .rond{background:var(--vert);color:#fff;border-color:#fff}
.balise.ouverte .rond{animation:pulse 1.3s infinite;background:var(--or);color:#3a2600;border-color:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.avatar{position:absolute;width:clamp(48px,7vw,86px);aspect-ratio:3/4;border-radius:14px;background:#fff center/contain no-repeat;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.4);transform:translate(-50%,-112%);transition:left 1s ease,top 1s ease;pointer-events:none}
.bandeau{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;align-items:center;gap:10px;background:rgba(255,253,248,.95);border-radius:18px;padding:8px 14px;box-shadow:var(--ombre);max-width:94vw}
.bandeau p{margin:0;font-size:clamp(14px,2vw,19px);font-weight:700}
.badges{display:flex;gap:4px}
.badges span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eee;font-size:17px;filter:grayscale(1);opacity:.45}
.badges span.ok{filter:none;opacity:1;background:#fff3c4;box-shadow:0 0 0 2px var(--or)}

/* Étape */
.tete{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tete .ico{font-size:clamp(34px,5vw,48px)}
.tete h2{margin:0;color:var(--violet);font-size:clamp(22px,3.6vw,34px)}
.tete small{display:block;font-family:"Andika";font-size:15px;color:var(--rose-f);font-weight:700}
.texte{display:flex;gap:10px;align-items:flex-start;font-size:clamp(17px,2.5vw,22px);line-height:1.45;margin:6px 0 12px}
.texte p{margin:0}
.consigne{background:var(--violet-c);border-radius:14px;padding:10px 14px}
.choix-liste{display:grid;gap:10px;margin:8px 0}
.choix{background:#fff;border:3px solid #e2dcef;border-radius:16px;padding:12px 16px;font-size:clamp(16px,2.4vw,21px);text-align:left;font-weight:700;display:flex;gap:10px;align-items:center}
.choix:hover{border-color:var(--violet)}
.choix.bon{border-color:var(--vert);background:#e3f6ea}
.choix.faux{border-color:var(--rouge);background:#fde8e7;animation:secoue .4s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.retour{min-height:1.6em;font-size:clamp(16px,2.3vw,20px);font-weight:700;margin:8px 0}
.retour.bon{color:var(--vert-f)} .retour.faux{color:#a8322e}
.pied{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.lecon{background:#fff6dc;border:3px dashed var(--or);border-radius:16px;padding:12px 16px;font-size:clamp(17px,2.5vw,22px);font-weight:700;display:flex;gap:10px;align-items:center;animation:entree .5s}
@keyframes entree{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cache{display:none!important}

/* Forêt des neurones */
.neurones{display:block;width:100%;max-width:560px;height:auto;margin:4px auto}
.palier{text-align:center;font-size:clamp(18px,2.6vw,24px);font-weight:700;color:var(--violet);min-height:1.4em}

/* Phare : grille */
.grille{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:560px;margin:6px auto}
.case{aspect-ratio:1;border-radius:14px;border:3px solid #e2dcef;background:#fff;display:grid;place-items:center;padding:8%}
.case svg{width:100%;height:100%;display:block}
.case.trouve{background:#fff3c4;border-color:var(--or);animation:pop .4s}
.case.distrait{animation:secoue .4s;background:#fde8e7}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.compteur{text-align:center;font-weight:700;font-size:20px}

/* Bibliothèque : mémoire */
.objets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:620px;margin:8px auto}
.objets.petit{grid-template-columns:repeat(6,1fr)}
.obj{background:#fff;border:3px solid #e2dcef;border-radius:14px;padding:6px 2px;text-align:center;font-size:clamp(26px,4.6vw,44px)}
.obj b{display:block;font-size:clamp(11px,1.5vw,15px);font-family:"Andika"}
button.obj[aria-pressed=true]{border-color:var(--violet);background:var(--violet-c)}
.obj.bon{border-color:var(--vert);background:#e3f6ea}
.obj.oubli{border-color:var(--or);background:#fff3c4}
.obj.faux{border-color:var(--rouge);background:#fde8e7}
.chrono{height:12px;border-radius:8px;background:#eee;overflow:hidden;max-width:620px;margin:8px auto}
.chrono i{display:block;height:100%;background:var(--violet);width:100%}
.scores{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.1);font-weight:700;text-align:center}
.score big{display:block;font-family:"Baloo 2";font-size:30px;color:var(--violet)}

/* Lac : étapes à remettre en ordre */
.ordre{display:grid;gap:8px;margin:8px 0}
.ordre .choix .n{width:34px;height:34px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none;font-family:"Baloo 2"}
.ordre .choix.place .n{background:var(--vert);color:#fff}
.calcul{font-family:"Baloo 2";font-size:clamp(34px,6vw,56px);text-align:center;margin:4px 0;color:var(--encre)}
.calcul .err{color:var(--rouge);text-decoration:underline wavy}

/* Fin : diplôme */
.diplome{text-align:center}
.diplome h2{font-size:clamp(28px,5vw,44px);color:var(--violet);margin:4px 0}
.diplome .nomperso{width:110px;height:140px;object-fit:contain;border-radius:16px;background:#fff;box-shadow:var(--ombre)}
.regles{text-align:left;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:12px 0}
.regle{background:#fff;border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:clamp(15px,2vw,18px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.regle span{font-size:26px}
.confetti{position:fixed;top:-20px;font-size:24px;animation:tombe linear forwards;pointer-events:none}
@keyframes tombe{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:700px){.balise .nom{display:none}.bandeau{flex-wrap:wrap;justify-content:center}}
@media print{
  body{background:#fff;overflow:visible}
  .ecran{position:static;display:none!important}
  #fin{display:block!important}
  #fin .fond,.pied,.son,.confetti{display:none!important}
  .centrer{position:static}
  .panneau{box-shadow:none;border:3px solid var(--violet);max-height:none;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ACCUEIL -->
<section class="ecran actif" id="accueil" aria-labelledby="t-accueil">
  <div class="fond flou"></div>
  <div class="centrer">
    <div class="panneau">
      <h1 id="t-accueil">Les explorateurs du cerveau</h1>
      <p class="sous">Entre dans ton cerveau et découvre ses 6 secrets pour mieux apprendre !</p>
      <div class="ligne"><button class="son" data-dire="Choisis ton explorateur ou ton exploratrice, puis clique sur Partir à l'aventure." data-n="1" aria-label="Écouter la consigne">🔊</button><p style="margin:0;font-weight:700">Choisis ton personnage :</p></div>
      <div class="persos">
        <button class="perso" data-p="f" aria-pressed="false"><img src="/images/cerveau/exploratrice.jpg" alt="">L'exploratrice</button>
        <button class="perso" data-p="g" aria-pressed="false"><img src="/images/cerveau/explorateur.jpg" alt="">L'explorateur</button>
      </div>
      <p class="ligne"><button class="btn vert" id="partir" disabled>Partir à l'aventure ➜</button></p>
    </div>
  </div>
</section>

<!-- CARTE -->
<section class="ecran" id="carte" aria-label="Carte du cerveau">
  <div class="scene" id="scene">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
  </div>
  <div class="bandeau"><button class="son" id="son-carte" aria-label="Écouter">🔊</button><p id="msg-carte"></p><div class="badges" id="badges"></div></div>
</section>

<!-- ÉTAPE -->
<section class="ecran" id="etape" aria-live="polite">
  <div class="fond flou"></div>
  <div class="centrer"><div class="panneau" id="panneau"></div></div>
</section>

<!-- FIN -->
<section class="ecran" id="fin">
  <div class="fond flou"></div>
  <div class="centrer">
    <div class="panneau diplome">
      <img class="nomperso" id="img-fin" src="" alt="">
      <h2 id="titre-fin">Diplôme d'explorateur du cerveau</h2>
      <p class="texte" style="justify-content:center"><button class="son" id="son-fin" aria-label="Écouter">🔊</button><span id="txt-fin"></span></p>
      <div class="regles" id="regles"></div>
      <div class="pied" style="justify-content:center">
        <button class="btn violet" onclick="window.print()">🖨️ Imprimer mon diplôme</button>
        <button class="btn" id="rejouer">↺ Rejouer</button>
      </div>
    </div>
  </div>
</section>

<script>
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var etat={perso:null,fait:0};

/* ---------- Voix ---------- */
var VOIX="/audio/cerveau/", lecteur=null;
function parle(s,n){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(lecteur){ lecteur.pause(); lecteur=null; }
  if(n){
    var a=new Audio(VOIX+n+".mp3"); lecteur=a;
    a.onerror=function(){ if(lecteur===a){ lecteur=null; synthese(s); } };
    a.play().catch(function(){ if(lecteur===a&&a.error){ lecteur=null; synthese(s); } });
    return;
  }
  synthese(s);
}
function synthese(s){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(s.replace(/\+/g," plus ").replace(/=/g," égale "));
    u.lang="fr-FR"; u.rate=.9;
    var v=speechSynthesis.getVoices().filter(function(x){return /^fr/i.test(x.lang);})[0];
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-dire]"); if(b) parle(b.getAttribute("data-dire"),b.getAttribute("data-n"));
});
function E(f){ return etat.perso==="f"?f[0]:f[1]; }
function g(s){ return s.replace(/\{e\}/g,E(["exploratrice","explorateur"])).replace(/\{E\}/g,E(["Exploratrice","Explorateur"])); }
function melange(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- Les 6 lieux du cerveau ---------- */
var LIEUX=[
  {id:"foret", nom:"La forêt des neurones", ico:"🌳", badge:"🌳", x:22, y:24,
   lecon:"Mon cerveau se muscle quand j'apprends : tout le monde peut progresser !"},
  {id:"phare", nom:"Le phare de l'attention", ico:"🔦", badge:"🔦", x:52, y:20,
   lecon:"Pour apprendre, je fais attention à une seule chose à la fois."},
  {id:"atelier", nom:"L'atelier des idées", ico:"⚙️", badge:"⚙️", x:80, y:24,
   lecon:"J'apprends en participant : je cherche, j'essaie, je pose des questions."},
  {id:"biblio", nom:"La bibliothèque des souvenirs", ico:"📚", badge:"📚", x:80, y:62,
   lecon:"Pour retenir, je refais en faisant toujours appel à ma mémoire, un peu chaque jour."},
  {id:"lac", nom:"Le lac miroir des erreurs", ico:"🪞", badge:"🪞", x:23, y:62,
   lecon:"Se tromper, c'est apprendre… si je comprends pourquoi je me suis trompé."},
  {id:"nuit", nom:"Le nuage du sommeil", ico:"🌙", badge:"🌙", x:52, y:58,
   lecon:"Quand je dors bien, mon cerveau range ce que j'ai appris."}
];

/* ---------- Accueil ---------- */
document.querySelectorAll(".perso").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".perso").forEach(function(x){x.setAttribute("aria-pressed","false");});
    b.setAttribute("aria-pressed","true"); etat.perso=b.dataset.p; $("#partir").disabled=false;
  });
});
$("#partir").addEventListener("click",function(){ etat.fait=0; montreCarte(); });
$("#rejouer").addEventListener("click",function(){ montre("accueil"); });

function montre(id){
  try{speechSynthesis.cancel();}catch(e){} if(lecteur){lecteur.pause();lecteur=null;}
  document.querySelectorAll(".ecran").forEach(function(s){s.classList.toggle("actif",s.id===id);});
}

/* ---------- Carte ---------- */
function montreCarte(){
  montre("carte");
  var sc=$("#scene");
  sc.querySelectorAll(".balise").forEach(function(b){b.remove();});
  LIEUX.forEach(function(l,i){
    var b=document.createElement("button");
    var st=i<etat.fait?"faite":(i===etat.fait?"ouverte":"fermee");
    b.className="balise "+st; b.style.left=l.x+"%"; b.style.top=l.y+"%";
    b.innerHTML='<span class="rond">'+(i<etat.fait?"✓":(i+1))+'</span><span class="nom">'+esc(l.nom)+'</span>';
    b.setAttribute("aria-label",(i+1)+". "+l.nom+(st==="faite"?" (terminé)":st==="fermee"?" (fermé)":" (à explorer)"));
    if(st==="fermee") b.disabled=true;
    b.addEventListener("click",function(){ ouvreLieu(i); });
    sc.appendChild(b);
  });
  var av=$("#avatar"), pos=LIEUX[Math.min(etat.fait,LIEUX.length-1)];
  av.style.backgroundImage="url(/images/cerveau/"+E(["exploratrice","explorateur"])+".jpg)";
  av.style.left=pos.x+"%"; av.style.top=pos.y+"%";
  $("#badges").innerHTML=LIEUX.map(function(l,i){return '<span class="'+(i<etat.fait?"ok":"")+'" title="'+esc(l.nom)+'">'+l.badge+'</span>';}).join("");
  var m=etat.fait===0?"Bienvenue dans ton cerveau ! Clique sur le lieu numéro 1 qui clignote.":"Bravo ! Clique sur le lieu suivant, celui qui clignote.";
  var mn=etat.fait===0?2:3;
  $("#msg-carte").textContent=m;
  $("#son-carte").onclick=function(){parle(m,mn);};
  setTimeout(function(){ var o=sc.querySelector(".balise.ouverte"); if(o) o.focus(); },80);
}

/* ---------- Outils pour les étapes ---------- */
var P; // panneau courant
function ouvreLieu(i){
  montre("etape"); P=$("#panneau"); P.innerHTML=""; P.scrollTop=0;
  var l=LIEUX[i];
  P.innerHTML='<div class="tete"><span class="ico" aria-hidden="true">'+l.ico+'</span><h2><small>Lieu '+(i+1)+' sur 6</small>'+esc(l.nom)+'</h2></div><div id="zone"></div>';
  ETAPES[l.id]($("#zone"), function(){ finLieu(i); });
}
function texte(z,t,cls,n){
  var d=document.createElement("div"); d.className="texte"+(cls?" "+cls:"");
  d.innerHTML='<button class="son" aria-label="Écouter">🔊</button><p>'+t+'</p>';
  d.querySelector(".son").setAttribute("data-dire",d.querySelector("p").textContent);
  if(n) d.querySelector(".son").setAttribute("data-n",n);
  z.appendChild(d); return d;
}
function el(z,html){ var d=document.createElement("div"); d.innerHTML=html; while(d.firstChild) z.appendChild(d.firstChild); return z.lastChild; }
function bouton(z,txt,cls,fn){ var p=el(z,'<div class="pied"><button class="btn '+(cls||"")+'">'+txt+'</button></div>'); var b=p.querySelector("button"); b.onclick=function(){p.remove();fn();}; b.focus({preventScroll:true}); return b; }
/* Question à choix : reste ouverte tant que la bonne réponse n'est pas trouvée */
function question(z,q,reps,bonne,explic,suite,nq,nok){
  var bloc=el(z,'<div></div>');
  texte(bloc,q,"consigne",nq);
  var liste=el(bloc,'<div class="choix-liste" role="group"></div>');
  var ret=el(bloc,'<p class="retour" role="status"></p>');
  melange(reps.map(function(r,k){return {t:r,k:k};})).forEach(function(r){
    var b=document.createElement("button"); b.className="choix"; b.textContent=r.t;
    b.onclick=function(){
      if(liste.dataset.fini) return;
      if(r.k===bonne){
        b.classList.add("bon"); liste.dataset.fini=1;
        ret.className="retour bon"; ret.textContent="✔ Oui ! "+explic; parle("Oui ! "+explic,nok);
        bouton(bloc,"Continuer ➜","",suite);
      }else{
        b.classList.add("faux"); b.disabled=true;
        ret.className="retour faux"; ret.textContent="Pas encore ! Ce n'est pas grave : se tromper, c'est apprendre. Essaie une autre réponse.";
        parle(ret.textContent,4);
      }
    };
    liste.appendChild(b);
  });
  bloc.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function lecon(z,t,suite,n){
  var d=el(z,'<div class="lecon"><button class="son" aria-label="Écouter">🔊</button><span>⭐ '+t+'</span></div>');
  d.querySelector(".son").setAttribute("data-dire",t); if(n) d.querySelector(".son").setAttribute("data-n",n);
  parle(t,n);
  bouton(z,"Retour à la carte 🗺️","vert",suite);
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finLieu(i){
  if(i===etat.fait) etat.fait++;
  if(etat.fait>=LIEUX.length) finale(); else montreCarte();
}

/* ---------- Formes du phare : l'étoile à 5 branches et des formes qui lui ressemblent ---------- */
var NOMS_FORMES={"etoile":"étoile","pentagone":"pentagone","fleur":"fleur","soleil":"soleil","asterisque":"astérisque","flocon":"flocon","hexagone":"hexagone","croix":"croix"};
function pts(n,R,r0,rot){var p=[];for(var i=0;i<n*2;i++){var a=Math.PI*i/n-Math.PI/2+rot,rr=i%2?r0:R;p.push((50+rr*Math.cos(a)).toFixed(1)+","+(50+rr*Math.sin(a)).toFixed(1));}return p.join(" ");}
function forme(c){
  var rot=(Math.random()-.5)*0.9, J="#f4b62a", T='stroke="#b9800a" stroke-width="3" stroke-linejoin="round"', o='<svg viewBox="0 0 100 100" aria-hidden="true">', f="</svg>", i, k="";
  if(c==="etoile") return o+'<polygon points="'+pts(5,44,18,rot)+'" fill="'+J+'" '+T+'/>'+f;
  if(c==="pentagone"){ var q=[];for(i=0;i<5;i++){var a=2*Math.PI*i/5-Math.PI/2+rot;q.push((50+40*Math.cos(a)).toFixed(1)+","+(50+40*Math.sin(a)).toFixed(1));} return o+'<polygon points="'+q.join(" ")+'" fill="'+J+'" '+T+'/>'+f; }
  if(c==="fleur"){ for(i=0;i<5;i++) k+='<ellipse cx="50" cy="27" rx="12" ry="21" fill="'+J+'" '+T+' transform="rotate('+(72*i+rot*57)+' 50 50)"/>'; return o+k+'<circle cx="50" cy="50" r="10" fill="#b9800a"/>'+f; }
  if(c==="soleil"){ for(i=0;i<10;i++) k+='<line x1="50" y1="6" x2="50" y2="20" stroke="#b9800a" stroke-width="5" stroke-linecap="round" transform="rotate('+(36*i+rot*57)+' 50 50)"/>'; return o+k+'<circle cx="50" cy="50" r="24" fill="'+J+'" '+T+'/>'+f; }
  if(c==="asterisque"){ for(i=0;i<5;i++) k+='<line x1="50" y1="50" x2="50" y2="8" stroke="'+J+'" stroke-width="11" stroke-linecap="round" transform="rotate('+(72*i+rot*57)+' 50 50)"/>'; return o+k+f; }
  if(c==="flocon"){ for(i=0;i<6;i++) k+='<g transform="rotate('+(60*i+rot*57)+' 50 50)"><line x1="50" y1="50" x2="50" y2="8" stroke="'+J+'" stroke-width="7" stroke-linecap="round"/><path d="M41 22 L50 30 L59 22" fill="none" stroke="'+J+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>'; return o+k+f; }
  if(c==="hexagone"){ var h=[];for(i=0;i<6;i++){var a2=Math.PI*i/3+rot;h.push((50+40*Math.cos(a2)).toFixed(1)+","+(50+40*Math.sin(a2)).toFixed(1));} return o+'<polygon points="'+h.join(" ")+'" fill="'+J+'" '+T+'/>'+f; }
  if(c==="croix") return o+'<path d="M38 8h24v30h30v24H62v30H38V62H8V38h30z" fill="'+J+'" '+T+' transform="rotate('+(rot*57)+' 50 50)"/>'+f;
}

/* ---------- Les 6 étapes ---------- */
var ETAPES={
  /* 1. Plasticité */
  foret:function(z,fin){
    texte(z,"Dans ton cerveau, il y a des milliards de petites cellules : les <b>neurones</b>. Quand tu apprends, ils se relient entre eux.","",6);
    texte(z,"Clique 3 fois sur <b>Je m'entraîne</b> et regarde ce qui se passe entre les deux neurones.","consigne",7);
    el(z,'<svg class="neurones" viewBox="0 0 560 170" role="img" aria-label="Deux neurones reliés par un chemin">'+
      '<defs><radialGradient id="gn" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#f4b62a"/></radialGradient></defs>'+
      '<g stroke="#c2577a" stroke-width="6" stroke-linecap="round" fill="none"><path d="M70 85 L20 40M70 85 L15 120M70 85 L55 160M490 85 L540 40M490 85 L545 125M490 85 L510 160"/></g>'+
      '<path id="lien" d="M110 85 C 220 20, 340 150, 450 85" fill="none" stroke="#5b3f8c" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>'+
      '<circle cx="80" cy="85" r="36" fill="url(#gn)" stroke="#c2577a" stroke-width="5"/><circle cx="480" cy="85" r="36" fill="url(#gn)" stroke="#c2577a" stroke-width="5"/>'+
      '<g id="etincelles"></g></svg>');
    var pal=el(z,'<p class="palier" role="status">Un tout petit chemin…</p>');
    var n=0;
    var p=el(z,'<div class="pied" style="justify-content:center"><button class="btn violet">💪 Je m\'entraîne</button></div>');
    var b=p.querySelector("button"); b.focus({preventScroll:true});
    b.onclick=function(){
      n++; var pn=0, lien=document.getElementById("lien");
      if(n===1){lien.setAttribute("stroke-width","8");lien.setAttribute("stroke-dasharray","14 8");pal.textContent="➜ Un sentier !";pn=8;}
      if(n===2){lien.setAttribute("stroke-width","16");lien.setAttribute("stroke-dasharray","");pal.textContent="➜ Une route !";pn=9;}
      if(n>=3){lien.setAttribute("stroke-width","28");lien.setAttribute("stroke","#f4b62a");pal.textContent="➜ Une autoroute ! Ton cerveau s'est musclé 💪";pn=10;
        p.remove();
        texte(z,"Plus tu t'entraînes, plus le chemin entre les neurones devient solide. C'est la <b>plasticité</b> du cerveau.","",11);
        question(z,"Quand j'apprends quelque chose de nouveau, mon cerveau…",
          ["change et se muscle","reste toujours pareil","se remplit et déborde"],0,
          "Ton cerveau change à chaque fois que tu apprends. Il n'y a pas de bonne ou de mauvaise mémoire : tout le monde peut progresser.",
          function(){ lecon(z,LIEUX[0].lecon,fin,14); },12,13);
      }
      parle(pal.textContent,pn);
    };
  },

  /* 2. Attention */
  phare:function(z,fin){
    texte(z,"Le phare éclaire une seule chose à la fois. Ton attention aussi ! Quand tu regardes partout, ton cerveau apprend moins bien.","",15);
    texte(z,"Touche seulement les <b>5 étoiles</b>. Ne te laisse pas distraire !","consigne",16);
    var cases=melange(["etoile","etoile","etoile","etoile","etoile","pentagone","pentagone","fleur","fleur","soleil","soleil","asterisque","asterisque","flocon","hexagone","hexagone","croix","pentagone"]);
    var gr=el(z,'<div class="grille" role="group" aria-label="Grille de 18 cases"></div>');
    var cpt=el(z,'<p class="compteur" role="status">Étoiles trouvées : 0 / 5</p>');
    var t=0, distractions=0;
    cases.forEach(function(c){
      var b=document.createElement("button"); b.className="case"; b.innerHTML=forme(c); b.setAttribute("aria-label",NOMS_FORMES[c]);
      b.onclick=function(){
        if(b.classList.contains("trouve")||t>=5) return;
        if(c==="etoile"){ b.classList.add("trouve"); t++; cpt.textContent="Étoiles trouvées : "+t+" / 5";
          if(t===5){ cpt.textContent="Bravo ! Tu as trouvé les 5 étoiles 🔦";
            parle(cpt.textContent,18);
            question(z,"Pour bien faire attention en classe, je…",
              ["regarde et j'écoute une seule chose","fais deux choses à la fois","regarde par la fenêtre"],0,
              "Ton attention est comme le phare : elle éclaire une seule chose à la fois.",
              function(){ lecon(z,LIEUX[1].lecon,fin,21); },19,20);
          }
        }else{ distractions++; b.classList.remove("distrait"); void b.offsetWidth; b.classList.add("distrait");
          cpt.textContent="Oups, c'est une distraction ! Cherche les étoiles. ("+t+" / 5)"; parle("Oups, c'est une distraction ! Cherche les étoiles.",17); }
      };
      gr.appendChild(b);
    });
  },

  /* 3. Participer */
  atelier:function(z,fin){
    texte(z,"Dans l'atelier, les idées se fabriquent en agissant. Ton cerveau apprend mieux quand tu <b>participes</b> : tu cherches, tu essaies, tu réponds.","",22);
    question(z,"Le maître explique un nouveau jeu de calcul. Que fais-tu ?",
      ["J'essaie, je cherche, je propose une réponse","J'attends que les autres trouvent","Je fais semblant d'avoir compris"],0,
      "Quand tu cherches toi-même, ton cerveau travaille et retient mieux.",
      function(){
        question(z,"Tu ne comprends pas la consigne. Que fais-tu ?",
          ["Je pose une question","Je ne dis rien","Je copie sur mon voisin"],0,
          "Poser une question, c'est être un vrai explorateur : c'est comme ça qu'on comprend.",
          function(){
            question(z,"Pour vérifier que j'ai compris, je peux…",
              ["redire avec mes mots ou l'expliquer à un camarade","juste hocher la tête","ranger vite mes affaires"],0,
              "Redire avec tes mots, faire un dessin ou expliquer à un ami : ça montre que tu as compris.",
              function(){ lecon(z,LIEUX[2].lecon,fin,29); },27,28);
          },25,26);
      },23,24);
  },

  /* 4. Recommencer en essayant de se rappeler */
  biblio:function(z,fin){
    var TOUS=[["🍎","pomme"],["🚲","vélo"],["🐟","poisson"],["⭐","étoile"],["🎩","chapeau"],["🦆","canard"],["🍫","chocolat"],["☂️","parapluie"],["🐘","éléphant"],["🎃","citrouille"],["🦋","papillon"],["🎺","trompette"]];
    var cibles=melange(TOUS).slice(0,6);
    var essais=[];
    texte(z,"Pour bien fonctionner, le cerveau oublie ! Dans la bibliothèque des souvenirs, on va voir comment <b>retenir</b>.","",30);
    texte(z,"Regarde bien ces 6 objets. Ils vont disparaître dans 10 secondes !","consigne",31);
    var zoneJeu=el(z,'<div></div>');
    function montrer(duree,suite){
      zoneJeu.innerHTML='<div class="objets">'+cibles.map(function(o){return '<div class="obj">'+o[0]+'<b>'+o[1]+'</b></div>';}).join("")+'</div><div class="chrono"><i></i></div>';
      var barre=zoneJeu.querySelector(".chrono i"), t0=Date.now();
      (function anim(){ var r=1-(Date.now()-t0)/duree; barre.style.width=Math.max(0,r*100)+"%"; if(r>0) requestAnimationFrame(anim); else suite(); })();
    }
    function retrouver(n,suite){
      var choix=melange(TOUS), sel=[];
      zoneJeu.innerHTML='';
      texte(zoneJeu,"Sans regarder, retrouve les 6 objets que tu as vus. Clique dessus.","consigne",32);
      var gr=el(zoneJeu,'<div class="objets" role="group"></div>');
      choix.forEach(function(o){
        var b=document.createElement("button"); b.className="obj"; b.setAttribute("aria-pressed","false"); b.innerHTML=o[0]+'<b>'+o[1]+'</b>';
        b.onclick=function(){
          if(gr.dataset.fini) return;
          var on=b.getAttribute("aria-pressed")!=="true";
          if(on&&sel.length>=6) return;
          b.setAttribute("aria-pressed",on); if(on) sel.push(o[1]); else sel.splice(sel.indexOf(o[1]),1);
          v.disabled=sel.length!==6; v.textContent="Vérifier ("+sel.length+" / 6)";
        };
        gr.appendChild(b);
      });
      var p=el(zoneJeu,'<div class="pied"><button class="btn" disabled>Vérifier (0 / 6)</button></div>'); var v=p.querySelector("button");
      v.onclick=function(){
        gr.dataset.fini=1; p.remove();
        var noms=cibles.map(function(o){return o[1];}), ok=0;
        gr.querySelectorAll(".obj").forEach(function(b){
          var nom=b.querySelector("b").textContent, pris=b.getAttribute("aria-pressed")==="true", cible=noms.indexOf(nom)>=0;
          if(pris&&cible){b.classList.add("bon");ok++;} else if(pris){b.classList.add("faux");} else if(cible){b.classList.add("oubli");}
        });
        essais.push(ok); suite(ok);
      };
    }
    bouton(z,"Je suis prêt ! ⏱️","",function(){
      montrer(10000,function(){
        retrouver(1,function(ok){
          var r=el(zoneJeu,'<div></div>');
          el(r,'<div class="scores"><div class="score">1er essai<big>'+ok+' / 6</big></div></div>');
          texte(r,"Regarde : en vert, les objets que tu as retrouvés ; en jaune, ceux que tu as oubliés. Maintenant, on va <b>recommencer en essayant de se rappeler</b> : tu les revois, puis tu essaies encore de les retrouver.","",33);
          bouton(r,"Je refais de mémoire 🔁","violet",function(){
            montrer(7000,function(){
              retrouver(2,function(ok2){
                var r2=el(zoneJeu,'<div></div>');
                el(r2,'<div class="scores"><div class="score">1er essai<big>'+essais[0]+' / 6</big></div><div class="score">2e essai<big>'+ok2+' / 6</big></div></div>');
                texte(r2,(ok2>=essais[0]?"Tu vois : en refaisant de mémoire, on retient mieux ! ":"Ce n'est pas grave : demain, en refaisant encore de mémoire, tu retiendras mieux. ")+"Relire ne suffit pas : il faut <b>chercher dans sa mémoire</b>, plusieurs fois.","",ok2>=essais[0]?34:35);
                question(r2,"Pour apprendre les mots de ma dictée, le mieux c'est de…",
                  ["regarder le mot, le cacher, l'écrire de mémoire, puis vérifier","relire la liste 10 fois","tout apprendre la veille au soir"],0,
                  "On cache le modèle et on se pose des questions. Et on le refait un peu chaque jour !",
                  function(){ lecon(r2,LIEUX[3].lecon,fin,38); },36,37);
              });
            });
          });
        });
      });
    });
  },

  /* 5. L'erreur */
  lac:function(z,fin){
    texte(z,"Le lac miroir reflète nos erreurs. Regarde ce qu'a écrit Léo : 8 + 5 = 12.","",39);
    el(z,'<p class="calcul" aria-label="8 plus 5 égale 12">8 + 5 = <span class="err">12</span></p>');
    question(z,"Léo s'est trompé. Est-ce qu'il est nul ?",
      ["Non ! Il est en train d'apprendre","Oui, il est nul en calcul"],0,
      "Se tromper, ce n'est pas être nul. Tout le monde se trompe en apprenant.",
      function(){
        var bloc=el(z,'<div></div>');
        texte(bloc,"Aide Léo : clique sur les 4 étapes <b>dans le bon ordre</b> pour apprendre de son erreur.","consigne",42);
        var ET=["Je repère mon erreur","Je cherche pourquoi je me suis trompé","Je corrige","Je retiens la bonne réponse"];
        var liste=el(bloc,'<div class="ordre" role="group"></div>'), ret=el(bloc,'<p class="retour" role="status"></p>'), k=0;
        melange(ET.map(function(t,i){return {t:t,i:i};})).forEach(function(e){
          var b=document.createElement("button"); b.className="choix"; b.innerHTML='<span class="n">?</span>'+e.t;
          b.onclick=function(){
            if(b.classList.contains("place")) return;
            if(e.i===k){ b.classList.add("place"); b.querySelector(".n").textContent=k+1; k++; ret.className="retour bon"; ret.textContent="✔ Étape "+k+" !";
              if(k===4){
                var ordre=Array.prototype.slice.call(liste.children).sort(function(a,c){return a.querySelector(".n").textContent-c.querySelector(".n").textContent;});
                ordre.forEach(function(x){liste.appendChild(x);});
                ret.textContent="✔ Bravo ! Léo a compris pourquoi : il a compté « 8, 9, 10, 11, 12 » en disant 8 deux fois. Il fallait compter « 9, 10, 11, 12, 13 ». La bonne réponse est 8 + 5 = 13.";
                parle(ret.textContent,44);
                bouton(bloc,"Continuer ➜","",function(){ lecon(bloc,LIEUX[4].lecon,fin,45); });
              }
            }else{ b.classList.remove("faux"); void b.offsetWidth; b.classList.add("faux"); setTimeout(function(){b.classList.remove("faux");},500);
              ret.className="retour faux"; ret.textContent="Pas encore : quelle étape vient ensuite ?"; parle(ret.textContent,43); }
          };
          liste.appendChild(b);
        });
      },40,41);
  },

  /* 6. Le sommeil */
  nuit:function(z,fin){
    texte(z,"Chut… Sur le nuage du sommeil, le cerveau travaille pendant que tu dors !","",46);
    question(z,"Pendant que je dors, mon cerveau…",
      ["range et garde ce que j'ai appris dans la journée","s'éteint complètement","efface tout ce que j'ai appris"],0,
      "La nuit, ton cerveau rejoue les leçons de la journée et les range dans ta mémoire.",
      function(){
        question(z,"Combien d'heures faut-il dormir chaque nuit quand on a entre 6 et 12 ans ?",

              ["lire un livre calmement","jouer à un jeu vidéo","regarder un écran dans son lit"],0,

              function(){ lecon(z,LIEUX[5].lecon,fin,53); },51,52);

};

/* ---------- Fin ---------- */
function finale(){
  montre("fin");
  $("#titre-fin").textContent=g("Diplôme d'{e} du cerveau");
  $("#img-fin").src="/images/cerveau/"+E(["exploratrice","explorateur"])+".jpg";
  var t="Bravo ! Tu as découvert les 6 secrets pour mieux apprendre.";
  $("#txt-fin").textContent=t; $("#son-fin").onclick=function(){parle(t,5);};
  $("#regles").innerHTML=LIEUX.map(function(l){return '<div class="regle"><span aria-hidden="true">'+l.badge+'</span>'+esc(l.lecon)+'</div>';}).join("");
  parle(t,5);
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    for(var i=0;i<40;i++){ var c=document.createElement("span"); c.className="confetti"; c.textContent=["⭐","🧠","🎉","✨"][i%4];
      c.style.left=Math.random()*100+"vw"; c.style.animationDuration=(2.5+Math.random()*2.5)+"s"; c.style.animationDelay=(Math.random()*1.5)+"s";
      document.body.appendChild(c); setTimeout(function(x){return function(){x.remove();};}(c),6500); }
  }
}
