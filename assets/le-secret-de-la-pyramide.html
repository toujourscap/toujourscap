<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le secret de la pyramide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sable:#f6e7c8; --sable2:#ecd3a1; --or:#c8901e; --or-f:#8a5a0c; --brun:#4a2e12;
  --ciel:#2f6f8f; --vert:#2e8b57; --rouge:#c0392b; --carte:#fff8e8;
  --ombre:0 6px 18px rgba(74,46,18,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
:root{color-scheme:light}
body{
  font-family:"Andika",system-ui,sans-serif; color:var(--brun); background:var(--sable);
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:linear-gradient(rgba(246,231,200,.55),rgba(246,231,200,.88)), url(/images/pyramide/decor.jpg) center/cover no-repeat;
}
.wrap{max-width:980px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:"Cinzel Decorative",serif;text-align:center;color:var(--or-f);font-size:clamp(26px,5vw,44px);margin:8px 0 4px;text-shadow:0 2px 0 #fff8}
.sous{text-align:center;margin:0 0 18px;font-size:18px}
.carte{background:var(--carte);border-radius:18px;box-shadow:var(--ombre);padding:18px;border:3px solid var(--sable2)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--or);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-size:20px;font-weight:700;box-shadow:0 4px 0 var(--or-f)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--or-f)}
.btn:disabled{opacity:.45;cursor:default}
.btn.vert{background:var(--vert);box-shadow:0 4px 0 #1d5e3a}
.btn.petit{font-size:16px;padding:8px 14px}

/* Accueil */
#accueil .choix{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
.perso{background:#fff;border:4px solid transparent;border-radius:18px;padding:10px;width:180px;text-align:center;font-size:20px;font-weight:700;color:var(--brun);box-shadow:var(--ombre)}
.perso img{width:100%;height:200px;object-fit:contain}
.perso[aria-pressed=true],.niv[aria-pressed=true]{border-color:var(--or);background:#fff4d6}
.niv{background:#fff;border:4px solid transparent;border-radius:14px;padding:14px 26px;font-size:22px;font-weight:700;color:var(--brun);box-shadow:var(--ombre)}
.niv small{display:block;font-size:14px;font-weight:400}
.titre-sec{text-align:center;font-size:20px;margin:6px 0}
.centre{text-align:center}

/* Jeu */
.entete{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.entete img.av{width:70px;height:90px;object-fit:contain;background:#fff;border-radius:12px;box-shadow:var(--ombre)}
.prog{flex:1}
.prog .lbl{font-weight:700;font-size:18px;margin-bottom:6px}
.morceaux{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#d9c08f;border-radius:10px;padding:3px;max-width:200px}
.morceau{aspect-ratio:4/21;border-radius:6px;background:#bfa673 repeating-linear-gradient(45deg,#c9b282 0 6px,#bba26f 6px 12px);overflow:hidden;position:relative}
.morceau.gagne{background-image:url(/images/pyramide/carte.jpg);background-size:700% 100%;animation:pop .6s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

.etape{margin-bottom:14px;animation:entree .45s ease}
@keyframes entree{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.etape h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--or);color:#fff;font-size:18px;flex:none}
.etape.faite .num{background:var(--vert)}
.etape.faite .num::after{content:"✓"}
.etape.faite .num span{display:none}
.enonce{font-size:clamp(20px,3vw,26px);line-height:1.5;margin:0 0 12px}
.enonce .q{font-weight:700;color:var(--or-f)}
.ligne{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.images{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vignette{border:4px solid #fff;border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:var(--ombre);aspect-ratio:4/3}
.vignette img{width:100%;height:100%;object-fit:cover;display:block}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{background:#fff;border:3px solid var(--sable2);border-radius:14px;padding:12px 22px;font-size:26px;font-weight:700;color:var(--brun);min-width:120px;box-shadow:var(--ombre)}
.bon{border-color:var(--vert)!important;background:#e3f6ea!important}
.faux{border-color:var(--rouge)!important;animation:secoue .4s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.saisie{font-family:inherit;font-size:28px;font-weight:700;color:var(--brun);border:3px solid var(--sable2);border-radius:12px;padding:8px 12px;width:min(320px,100%);background:#fff}
.saisie.court{width:140px}
.clavier{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:420px}
.clavier button{width:52px;height:48px;border-radius:10px;border:2px solid var(--sable2);background:#fff;font-size:22px;font-weight:700;color:var(--brun)}
.clavier button.op{background:#fff4d6}
.msg{min-height:28px;font-size:18px;margin-top:8px;font-weight:700}
.msg.ok{color:var(--vert)} .msg.ko{color:var(--rouge)}
.unite{font-size:24px;font-weight:700}
.bravo{text-align:center}
.bravo p{font-size:22px;margin:6px 0 14px}
.final img{width:100%;border-radius:14px;box-shadow:var(--ombre)}
.final h2{font-family:"Cinzel Decorative",serif;color:var(--or-f);text-align:center;font-size:clamp(22px,4vw,34px);margin:8px 0}
.final p{text-align:center;font-size:21px}
.cache{display:none!important}
.quitter{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;background:#fff;color:var(--brun);border:2px solid var(--sable2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:var(--ombre)}
.quitter:hover,.quitter:focus-visible{background:#fff4d6;outline:3px solid var(--or)}
#jeu .entete{padding-right:150px}
@media (max-width:560px){#jeu .entete{padding-right:0;padding-top:44px}}
@media (max-width:560px){
  .images{grid-template-columns:1fr 1fr}
  .perso{width:46%} .perso img{height:150px}
  .opt{min-width:90px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<a class="quitter" href="/maths/" target="_top">✕ Quitter le jeu</a>

<!-- ACCUEIL -->
<section id="accueil">
  <h1>Le secret de la pyramide</h1>
  <p class="sous">Résous 7 problèmes pour reconstituer la carte qui mène à la tombe du roi.</p>
  <div class="carte">
    <p class="titre-sec">1. Choisis ton personnage</p>
    <div class="choix" id="choixPerso">
      <button class="perso" data-p="g" aria-pressed="false"><img src="/images/pyramide/explorateur.jpg" alt="">L'explorateur</button>
      <button class="perso" data-p="f" aria-pressed="false"><img src="/images/pyramide/exploratrice.jpg" alt="">L'exploratrice</button>
    </div>
    <p class="titre-sec">2. Choisis ton niveau</p>
    <div class="choix" id="choixNiv">
      <button class="niv" data-n="CP" aria-pressed="false">CP<small>je choisis les réponses</small></button>
      <button class="niv" data-n="CE1" aria-pressed="false">CE1<small>j'écris les réponses</small></button>
    </div>
    <p class="centre"><button class="btn vert" id="partir" disabled>Entrer dans la pyramide ➜</button></p>
  </div>
</section>

<!-- JEU -->
<section id="jeu" class="cache">
  <div class="entete">
    <img class="av" id="avatar" alt="">
    <div class="prog">
      <div class="lbl" id="lblProg"></div>
      <div class="morceaux" id="morceaux"></div>
    </div>
  </div>
  <div id="etapes"></div>
</section>

<!-- FIN -->
<section id="fin" class="cache final">
  <div class="carte">
    <h2 id="finTitre">Tu as la carte !</h2>
    <img id="finImg" src="/images/pyramide/carte.jpg" alt="Carte de la pyramide menant à la tombe du roi">
    <p id="finTexte"></p>
    <p class="centre" id="finBoutons"></p>
  </div>
</section>

</div>

<script>
(function(){
"use strict";

/* ---------- Problèmes ----------
   {E} = L'explorateur / L'exploratrice, {e} = l'explorateur / l'exploratrice,
   {il} = il / elle, {Il} = Il / Elle
   ops : choix d'opérations (CP) — la première est la bonne
   rep : choix de réponses (CP) — la première est la bonne
   nb  : nombres à utiliser (CE1), alt : autres écritures acceptées
*/
var PB = {
 CP: [
  {img:"cp-pieces", t:"{E} a 6 pièces d'or dans son sac. {Il} en trouve 4 de plus dans le sable.", q:"Combien de pièces d'or a-t-{il} maintenant ?", ops:["6 + 4","6 − 4","6 + 6"], res:10, rep:[10,2,12], u:"pièces d'or"},
  {img:"cp-torches", t:"Dans le couloir de la pyramide, 12 torches sont allumées. Le vent en éteint 3.", q:"Combien de torches restent allumées ?", ops:["12 − 3","12 + 3","3 + 3"], res:9, rep:[9,15,8], u:"torches"},
  {img:"cp-caravane", t:"La caravane compte 14 animaux. Il y a 6 chameaux. Les autres sont des ânes.", q:"Combien y a-t-il d'ânes ?", ops:["14 − 6","14 + 6","6 + 6"], res:8, rep:[8,20,7], u:"ânes"},
  {img:"cp-scarabees", t:"Sam trouve 8 scarabées dorés. Lina en trouve 5 de plus que Sam.", q:"Combien de scarabées Lina a-t-elle trouvés ?", ops:["8 + 5","8 − 5","5 + 5"], res:13, rep:[13,3,12], u:"scarabées"},
  {img:"cp-vases", t:"Dans la première salle, {e} compte 7 vases. Dans la deuxième salle, il y a 5 vases.", q:"Combien de vases y a-t-il en tout ?", ops:["7 + 5","7 − 5","7 + 7"], res:12, rep:[12,2,11], u:"vases"},
  {img:"cp-amulettes", t:"Le pharaon possède 15 amulettes. Il en donne 5 aux prêtres.", q:"Combien d'amulettes lui reste-t-il ?", ops:["15 − 5","15 + 5","5 + 5"], res:10, rep:[10,20,11], u:"amulettes"},
  {img:"cp-bateau", t:"Un bateau sur le Nil transporte 9 sacs de blé. Au port, on charge 7 sacs de plus.", q:"Combien de sacs y a-t-il sur le bateau ?", ops:["9 + 7","9 − 7","7 + 7"], res:16, rep:[16,2,15], u:"sacs"}
 ],
 CE1: [
  {img:"ce1-coffre", pieges:["ce1-coffre-p1","ce1-coffre-p2"], t:"{E} a 34 pierres précieuses. Dans un vieux coffre, {il} en trouve 15 de plus.", q:"Combien de pierres précieuses a-t-{il} maintenant ?", nb:[34,15], res:49, u:"pierres"},
  {img:"ce1-papyrus", pieges:["ce1-papyrus-p1","ce1-papyrus-p2"], t:"{E} a des papyrus dans son sac. Un marchand lui en donne 12. Maintenant, {il} en a 45.", q:"Combien de papyrus avait-{il} avant ?", nb:[45,12], res:33, u:"papyrus"},
  {img:"ce1-traineaux", pieges:["ce1-traineaux-p1","ce1-traineaux-p2"], t:"Les ouvriers chargent 4 traîneaux. Sur chaque traîneau, ils posent 6 blocs de pierre.", q:"Combien de blocs de pierre ont-ils chargés en tout ?", nb:[4,6], alt:["6+6+6+6"], res:24, u:"blocs"},
  {img:"ce1-dattes", pieges:["ce1-dattes-p1","ce1-dattes-p2"], t:"{E} a 24 dattes. {Il} les partage équitablement entre ses 3 chameaux.", q:"Combien de dattes reçoit chaque chameau ?", nb:[24,3], res:8, u:"dattes"},
  {img:"ce1-marches", pieges:["ce1-marches-p1","ce1-marches-p2"], t:"La pyramide a 60 marches. {E} en a déjà monté 25.", q:"Combien de marches lui reste-t-il à monter ?", nb:[60,25], res:35, u:"marches"},
  {img:"ce1-lampes", pieges:["ce1-lampes-p1","ce1-lampes-p2"], t:"Une lampe à huile coûte 5 pièces d'or. {E} achète 6 lampes.", q:"Combien de pièces d'or doit-{il} payer ?", nb:[6,5], alt:["5+5+5+5+5+5"], res:30, u:"pièces d'or"},
  {img:"ce1-perles", pieges:["ce1-perles-p1","ce1-perles-p2"], t:"Pour faire des colliers, le bijoutier a 28 perles bleues et 35 perles rouges.", q:"Combien de perles a-t-il en tout ?", nb:[28,35], res:63, u:"perles"}
 ]
};

var etat = {perso:null, niv:null, i:0, liste:[]};
var $ = function(s,r){return (r||document).querySelector(s);};
var el = function(tag, attrs, html){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(html!=null) e.innerHTML=html; return e;
};
function melange(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function txt(s){
  var f=etat.perso==="f";
  return s.replace(/\{E\}/g,f?"L'exploratrice":"L'explorateur")
          .replace(/\{e\}/g,f?"l'exploratrice":"l'explorateur")
          .replace(/\{il\}/g,f?"elle":"il").replace(/\{Il\}/g,f?"Elle":"Il");
}

/* ---------- Voix ---------- */
function parle(s){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(s.replace(/−/g," moins ").replace(/×/g," fois "));
    u.lang="fr-FR"; u.rate=.9;
    var v=speechSynthesis.getVoices().filter(function(x){return /^fr/i.test(x.lang);})[0];
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Accueil ---------- */
function majPartir(){ $("#partir").disabled = !(etat.perso && etat.niv); }
document.querySelectorAll(".perso").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".perso").forEach(function(x){x.setAttribute("aria-pressed","false");});
    b.setAttribute("aria-pressed","true"); etat.perso=b.dataset.p; majPartir();
  });
});
document.querySelectorAll(".niv").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".niv").forEach(function(x){x.setAttribute("aria-pressed","false");});
    b.setAttribute("aria-pressed","true"); etat.niv=b.dataset.n; majPartir();
  });
});
$("#partir").addEventListener("click",demarrer);

function demarrer(){
  etat.i=0; etat.liste=PB[etat.niv];
  $("#avatar").src = etat.perso==="f" ? "/images/pyramide/exploratrice.jpg" : "/images/pyramide/explorateur.jpg";
  var m=$("#morceaux"); m.innerHTML="";
  for(var k=0;k<7;k++){ var d=el("div",{class:"morceau"}); d.style.backgroundPosition=(k*100/6)+"% 0"; m.appendChild(d); }
  $("#accueil").classList.add("cache"); $("#fin").classList.add("cache"); $("#jeu").classList.remove("cache");
  probleme();
}

function majProg(){
  $("#lblProg").textContent="Problème "+(etat.i+1)+" sur 7 — morceaux de carte : "+etat.i+" / 7";
}

/* ---------- Un problème ---------- */
function probleme(){
  majProg();
  var p=etat.liste[etat.i], zone=$("#etapes"); zone.innerHTML="";
  var enonce=txt(p.t), question=txt(p.q);

  // Étape 1 : lire
  var e1=carteEtape(1,"Lis bien l'énoncé du problème");
  e1.appendChild(el("p",{class:"enonce"}, enonce+" <span class='q'>"+question+"</span>"));
  var l1=el("div",{class:"ligne"});
  var bEcoute=el("button",{class:"btn petit",type:"button"},"🔊 Écouter");
  bEcoute.addEventListener("click",function(){parle(enonce+" "+question);});
  var bLu=el("button",{class:"btn vert",type:"button"},"J'ai bien lu ✓");
  l1.appendChild(bEcoute); l1.appendChild(bLu); e1.appendChild(l1);
  zone.appendChild(e1);
  bLu.addEventListener("click",function(){ bLu.disabled=true; finEtape(e1); etape2(p,zone); });
  window.scrollTo({top:0,behavior:"smooth"});
}

function carteEtape(n,titre){
  var c=el("div",{class:"carte etape"});
  c.appendChild(el("h2",null,"<span class='num'><span>"+n+"</span></span>"+titre));
  return c;
}
function finEtape(c){ c.classList.add("faite"); }
function montre(c){ setTimeout(function(){ var r=c.getBoundingClientRect(); var y=window.scrollY+r.top-Math.max(16,(window.innerHeight-r.height)/2); window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); },60); }
function msgZone(c){ var m=el("div",{class:"msg","aria-live":"polite"}); c.appendChild(m); return m; }
function dire(m,ok,s){ m.className="msg "+(ok?"ok":"ko"); m.textContent=s; }

// Étape 2 : choisir l'image
function etape2(p,zone){
  var c=carteEtape(2,"Choisis l'image qui correspond au problème");
  var choix = p.pieges
    ? melange([p.img].concat(p.pieges))
    : melange([p.img].concat(melange(etat.liste.filter(function(x){return x!==p;})).slice(0,2).map(function(x){return x.img;})));
  var g=el("div",{class:"images"}); var m;
  choix.forEach(function(x){
    var b=el("button",{class:"vignette",type:"button","aria-label":"Image"});
    b.appendChild(el("img",{src:"/images/pyramide/"+x+".jpg",alt:""}));
    b.addEventListener("click",function(){
      if(c.classList.contains("faite")) return;
      if(x===p.img){ b.classList.add("bon"); dire(m,true,"Oui ! C'est bien cette image."); finEtape(c); etape3(p,zone); }
      else { b.classList.remove("faux"); void b.offsetWidth; b.classList.add("faux"); dire(m,false,"Ce n'est pas cette image. Relis l'énoncé : que se passe-t-il exactement ?"); }
    });
    g.appendChild(b);
  });
  c.appendChild(g); m=msgZone(c); zone.appendChild(c); montre(c);
}

// Étape 3 : opération
function etape3(p,zone){
  var cp=etat.niv==="CP";
  var c=carteEtape(3, cp ? "Choisis la bonne opération" : "Écris l'opération qui permet de trouver la réponse");
  var m;
  if(cp){
    var o=el("div",{class:"opts"});
    melange(p.ops).forEach(function(op){
      var b=el("button",{class:"opt",type:"button"},op);
      b.addEventListener("click",function(){
        if(c.classList.contains("faite")) return;
        if(op===p.ops[0]){ b.classList.add("bon"); dire(m,true,"Bravo, c'est la bonne opération !"); finEtape(c); etape4(p,zone); }
        else { b.classList.remove("faux"); void b.offsetWidth; b.classList.add("faux"); dire(m,false,"Non. Que se passe-t-il dans l'histoire ? On ajoute ou on enlève ?"); }
      });
      o.appendChild(b);
    });
    c.appendChild(o);
  } else {
    var l=el("div",{class:"ligne"});
    var inp=el("input",{class:"saisie",type:"text",inputmode:"none",autocomplete:"off","aria-label":"Opération",placeholder:"ex. : 10 + 5"});
    var ok=el("button",{class:"btn vert",type:"button"},"Valider");
    l.appendChild(inp); l.appendChild(ok); c.appendChild(l);
    c.appendChild(clavier(inp,true));
    var valider=function(){
      if(c.classList.contains("faite")) return;
      var r=verifOp(inp.value,p);
      if(r===true){ inp.classList.remove("faux"); inp.classList.add("bon"); inp.readOnly=true; ok.disabled=true; dire(m,true,"Bravo, ton opération est juste !"); finEtape(c); etape4(p,zone); }
      else { inp.classList.remove("faux"); void inp.offsetWidth; inp.classList.add("faux"); dire(m,false,r); }
    };
    ok.addEventListener("click",valider);
    inp.addEventListener("keydown",function(ev){ if(ev.key==="Enter") valider(); });
  }
  m=msgZone(c); zone.appendChild(c); montre(c);
}

function normalise(s){
  return s.split("=")[0].replace(/[×xX*]/g,"*").replace(/[÷:\/]/g,"/").replace(/[−–—]/g,"-").replace(/\s+/g,"");
}
function verifOp(s,p){
  var n=normalise(s);
  if(!n) return "Écris une opération.";
  if(!/^\d+([+\-*\/]\d+)+$/.test(n)) return "Écris une opération avec des nombres et un signe (+, −, ×, :).";
  var val; try{ val=Function('"use strict";return ('+n+')')(); }catch(e){ return "Je ne comprends pas cette opération."; }
  if(p.alt && p.alt.indexOf(n)>=0) return true;
  var nombres=n.split(/[+\-*\/]/).map(Number).sort(function(a,b){return a-b;});
  var attendus=p.nb.slice().sort(function(a,b){return a-b;});
  var memes = nombres.length===attendus.length && nombres.every(function(v,k){return v===attendus[k];});
  if(!memes) return "Utilise les nombres de l'énoncé.";
  if(val!==p.res) return "Ce n'est pas la bonne opération. Relis la question.";
  return true;
}

// Étape 4 : réponse
function etape4(p,zone){
  var cp=etat.niv==="CP";
  var c=carteEtape(4, cp ? "Choisis la bonne réponse" : "Écris la réponse");
  var m;
  if(cp){
    c.appendChild(el("p",{class:"enonce"},"<span class='q'>"+txt(p.q)+"</span>"));
    var o=el("div",{class:"opts"});
    melange(p.rep).forEach(function(r){
      var b=el("button",{class:"opt",type:"button"},r+" "+p.u);
      b.addEventListener("click",function(){
        if(c.classList.contains("faite")) return;
        if(r===p.res){ b.classList.add("bon"); finEtape(c); gagne(p,zone); }
        else { b.classList.remove("faux"); void b.offsetWidth; b.classList.add("faux"); dire(m,false,"Ce n'est pas le bon résultat. Calcule "+p.ops[0]+"."); }
      });
      o.appendChild(b);
    });
    c.appendChild(o);
  } else {
    c.appendChild(el("p",{class:"enonce"},"<span class='q'>"+txt(p.q)+"</span>"));
    var l=el("div",{class:"ligne"});
    var inp=el("input",{class:"saisie court",type:"text",inputmode:"none",autocomplete:"off","aria-label":"Réponse"});
    var ok=el("button",{class:"btn vert",type:"button"},"Valider");
    l.appendChild(inp); l.appendChild(el("span",{class:"unite"},p.u)); l.appendChild(ok); c.appendChild(l);
    c.appendChild(clavier(inp,false));
    var valider=function(){
      if(c.classList.contains("faite")) return;
      var v=inp.value.replace(/\s/g,"");
      if(v===String(p.res)){ inp.classList.remove("faux"); inp.classList.add("bon"); inp.readOnly=true; ok.disabled=true; finEtape(c); gagne(p,zone); }
      else { inp.classList.remove("faux"); void inp.offsetWidth; inp.classList.add("faux"); dire(m,false, v===""?"Écris ta réponse.":"Ce n'est pas le bon résultat. Vérifie ton calcul."); }
    };
    ok.addEventListener("click",valider);
    inp.addEventListener("keydown",function(ev){ if(ev.key==="Enter") valider(); });
  }
  m=msgZone(c); zone.appendChild(c); montre(c);
}

function clavier(inp,avecOps){
  var k=el("div",{class:"clavier"});
  var touches="1234567890".split("");
  if(avecOps) touches=touches.concat(["+","−","×",":"]);
  touches.push("⌫");
  touches.forEach(function(t){
    var b=el("button",{type:"button",class:/[+−×:]/.test(t)?"op":""},t);
    b.addEventListener("click",function(){
      if(inp.readOnly) return;
      if(t==="⌫") inp.value=inp.value.replace(/\s*\S\s*$/,"");
      else if(/[+−×:]/.test(t)) inp.value=inp.value.replace(/\s+$/,"")+" "+t+" ";
      else inp.value+=t;
      inp.focus();
    });
    k.appendChild(b);
  });
  // sur ordinateur, on peut aussi taper au clavier
  if(!("ontouchstart" in window)) inp.removeAttribute("inputmode");
  return k;
}

function gagne(p,zone){
  var morceau=document.querySelectorAll(".morceau")[etat.i];
  morceau.classList.add("gagne");
  etat.i++; majProg();
  var c=el("div",{class:"carte etape bravo"});
  var dernier = etat.i>=7;
  c.appendChild(el("p",null,"🎉 Bravo ! La réponse est <b>"+p.res+" "+p.u+"</b>.<br>Tu gagnes un morceau de la carte !"));
  var b=el("button",{class:"btn vert",type:"button"}, dernier ? "Voir la carte complète ➜" : "Problème suivant ➜");
  b.addEventListener("click", dernier ? finCarte : probleme);
  c.appendChild(b); zone.appendChild(c); montre(c);
}

/* ---------- Fin ---------- */
function finCarte(){
  $("#jeu").classList.add("cache"); $("#fin").classList.remove("cache");
  $("#finTitre").textContent="Tu as reconstitué la carte !";
  $("#finImg").src="/images/pyramide/carte.jpg"; $("#finImg").alt="Carte de la pyramide menant à la tombe du roi";
  $("#finTexte").textContent="Les 7 morceaux sont réunis. Le chemin rouge mène à la chambre secrète du roi…";
  var fb=$("#finBoutons"); fb.innerHTML="";
  var b=el("button",{class:"btn vert",type:"button"},"Suivre le chemin ➜");
  b.addEventListener("click",finTombe); fb.appendChild(b);
  window.scrollTo({top:0,behavior:"smooth"});
}
function finTombe(){
  $("#finTitre").textContent="La tombe du roi !";
  $("#finImg").src="/images/pyramide/tombe.jpg"; $("#finImg").alt="La chambre funéraire du roi, pleine de trésors";
  $("#finTexte").textContent=(etat.perso==="f"?"Bravo exploratrice ! Tu":"Bravo explorateur ! Tu")+" as résolu tous les problèmes et découvert le trésor du pharaon.";
  var fb=$("#finBoutons"); fb.innerHTML="";
  var b=el("button",{class:"btn",type:"button"},"Rejouer");
  b.addEventListener("click",function(){ $("#fin").classList.add("cache"); $("#accueil").classList.remove("cache"); window.scrollTo(0,0); });
  fb.appendChild(b);
  window.scrollTo({top:0,behavior:"smooth"});
}
})();
</script>
