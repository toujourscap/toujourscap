<p class="lead">Le jeu reprend pas à pas <a href="/post/apprendre-sa-dictee-methode-de-la-feuille-pliee/">la méthode de la feuille pliée</a>. L'élève choisit son détective et apprend les phrases de la dictée donnée par son enseignante : il copie, repère les pièges, plie la feuille, écrit de mémoire et corrige ses erreurs en couleur, jusqu'à zéro erreur.</p>
