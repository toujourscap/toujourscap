<p class="lead">Collez le texte de votre dictée : l'outil repère les mots difficiles et les remplace par des trous. Vous ajustez d'un clic, puis vous imprimez la fiche élève et son corrigé, ou vous faites faire la dictée sur l'ordinateur : l'élève écoute le texte, écrit les mots manquants et vérifie lui-même.</p>
