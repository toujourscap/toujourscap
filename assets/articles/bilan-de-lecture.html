<p class="lead">Un bilan de lecture à faire passer à un élève de cycle 2, en tête-à-tête avec un adulte : sons, mots, textes en fluence, discrimination visuelle et auditive de b, d, p, q, empan visuel. L'élève lit ou montre, l'adulte valide chaque réponse, et le bilan s'écrit tout seul à la fin.</p>
