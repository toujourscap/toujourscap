<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilan de lecture — documents papier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box}
body{margin:0;font-family:"Andika","Comic Sans MS",Arial,sans-serif;color:#222;background:#e9e4da}
.outils{position:sticky;top:0;z-index:2;background:#24527a;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.outils button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.outils label{font-size:.95rem}
.page{background:#fff;width:210mm;min-height:297mm;margin:14px auto;padding:12mm 13mm;box-shadow:0 2px 10px rgba(0,0,0,.15);page-break-after:always;break-after:page;position:relative}
.page:last-child{page-break-after:auto;break-after:auto}
.pied{position:absolute;bottom:7mm;left:13mm;right:13mm;font-size:9pt;color:#888;display:flex;justify-content:space-between}
h1{font-size:17pt;margin:0 0 3mm;color:#24527a}
h2{font-size:13pt;margin:5mm 0 2mm;color:#24527a;border-bottom:1.5px solid #24527a;padding-bottom:1mm}
.tag{display:inline-block;font-size:9pt;font-weight:700;padding:1px 8px;border-radius:10px;background:#24527a;color:#fff;vertical-align:middle;margin-left:6px}
.tag.e{background:#e8912d}
.ent{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:4mm;font-size:11pt;margin-bottom:3mm}
.ent span{border-bottom:1px dotted #777;padding-bottom:1mm}
/* planches élève */
.cases{display:grid;gap:4mm;margin:3mm 0 6mm}
.cases div{border:1.5px solid #bbb;border-radius:4mm;text-align:center;display:flex;align-items:center;justify-content:center}
.c-lettres{grid-template-columns:repeat(3,1fr)}.c-lettres div{font-size:52pt;height:31mm}
.c-graph{grid-template-columns:repeat(4,1fr)}.c-graph div{font-size:38pt;height:27mm}
.c-mots{grid-template-columns:repeat(4,1fr)}.c-mots div{font-size:24pt;height:21mm}
.num{position:relative}.num::before{content:attr(data-n);position:absolute;top:1mm;left:2mm;font-size:8pt;color:#999}
.texteE{font-size:20pt;line-height:2;margin:4mm 0 8mm}
.texteE.grand{font-size:22pt}
.ligneChoix{display:flex;align-items:center;gap:6mm;border-bottom:1px solid #ddd;padding:2.2mm 0}
.ligneChoix .mod{font-size:30pt;border:2.5px solid #24527a;border-radius:3mm;background:#fff3c4;min-width:26mm;text-align:center}
.ligneChoix .ch{display:flex;gap:9mm;font-size:30pt}
.ligneChoix .n{font-size:9pt;color:#999;width:6mm}
.grosses{display:flex;justify-content:space-around;font-size:80pt;margin:2mm 0}
.empanE{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}.empanE .ligneChoix{gap:3mm;padding:3mm 0}.empanE .ch{gap:5mm;font-size:22pt}
.serre td,.serre th{padding:.6mm 1.5mm;font-size:9.5pt}.serre h2{margin-top:3mm}
.pareil{display:flex;justify-content:space-around;font-size:36pt;margin:3mm 0}
.pareil div{border:2px solid #bbb;border-radius:5mm;padding:4mm 12mm}
/* feuille adulte */
table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:2mm}
th,td{border:1px solid #aaa;padding:1.2mm 2mm;text-align:left}
th{background:#eef3f9;font-weight:700}
td.it{font-size:13pt;width:24mm}
td.cc{width:9mm;text-align:center;color:#bbb}
.tot{font-size:10.5pt;margin:1mm 0 3mm}
.tot b{display:inline-block;min-width:22mm;border-bottom:1px solid #555}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.consigne{font-size:10pt;background:#fff8e1;border-left:3px solid #e8912d;padding:1.5mm 3mm;margin:1mm 0 2mm}
.texteA{font-size:12.5pt;line-height:2.1}
.texteA sup{font-size:7pt;color:#999;margin-left:1px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;font-size:10.5pt;margin:2mm 0 4mm}
.calc div{border:1px solid #aaa;border-radius:2mm;padding:2mm;min-height:13mm}
.lignes div{border-bottom:1px solid #bbb;height:8mm}
/* cartes empan */
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cartes div{border:1px dashed #999;height:34mm;display:flex;align-items:center;justify-content:center;font-size:44pt;position:relative}
.cartes div small{position:absolute;top:1mm;left:2mm;font-size:8pt;color:#999}
@media print{body{background:#fff}.outils{display:none}.page{margin:0;box-shadow:none;width:auto;min-height:0;padding:0;height:272mm;overflow:hidden}.pied{bottom:0;left:0;right:0}}
@media screen and (max-width:820px){.page{transform-origin:top left;width:210mm}}
</style>
</head>
<body>
<div class="outils">
 <b>📄 Documents papier du bilan de lecture</b>
 <button id="impr">🖨 Imprimer</button>
 <label><input type="checkbox" data-p="eleve" checked> Planches élève</label>
 <label><input type="checkbox" data-p="adulte" checked> Feuille de passation</label>
 <label><input type="checkbox" data-p="cartes" checked> Cartes empan</label>
 <label><input type="checkbox" data-p="bilan" checked> Fiche bilan</label>
 <span id="msg"></span>
</div>
<div id="doc"></div>
<script>
"use strict";
const VS=['a','e','i','o','u','y','é','è','ê'];
const VC=['ou','oi','on','an','en','in','un','au','eau','ai','ei','eu','œu','oin','ain','ein'];
const MS=['ami','lune','moto','vélo','rame','pile','mule','sofa','robe','tomate','salade','domino','farine','cabane','malade','numéro'];
const MC=['loup','roi','bonbon','lapin','maison','moulin','bateau','poule','raisin','lundi','peinture','coin','jardin','oiseau','chapeau','feuille'];
const TS="Léa a une amie : Mila. Mila a une petite tortue, Titi. Titi file sur le tapis. Elle a vu une salade. Hop ! Titi a dévoré la salade. Mila rit. Léa rit avec Mila.";
const TC="Le petit lapin de Manon s'appelle Pompon. Chaque matin, il sort de sa maison en bois et il court dans le jardin. Il mange des feuilles de chou et une carotte. Un jour, un gros oiseau noir se pose sur le toit de sa cabane. Pompon a très peur ! Il rentre bien vite chez lui, sous la paille.";
const VIS=[['b','d b q p'],['d','p d b q'],['p','q b p d'],['q','d q p b'],['d','b p q d'],['b','q d b p'],['q','p q d b'],['p','d p b q'],
 ['bd','db bd pd bp'],['pq','qp pb pq bq'],['db','bd qb db dp'],['qp','qb pq qp dp'],['bp','db pb bq bp'],['dq','qd bq dq dp']];
const AUD=[['bébé','b'],['dodo','d'],['papa','p'],['quatre','q'],['bulle','b'],['poule','p'],['dune','d'],['quille','q'],['bain','b'],['pain','p'],['dent','d'],['queue','q']];
const PAR=[['bain','pain'],['dent','dent'],['bon','don'],['pas','pas'],['bille','quille'],['dos','dos'],['pont','bon'],['qui','qui']];
const EMP={1:[['r','r n m s'],['a','o a e c'],['t','f l t i'],['s','z s c e'],['u','n v u a']],
 2:[['ma','am na ma mo'],['lo','ol to lo la'],['ri','ir rj ni ri'],['fu','uf tu fu fv'],['se','es ze se sc']],
 3:[['mar','mra nar mar mor'],['lit','lti tit lif lit'],['sev','esv zev sev seu'],['nol','onl mol nol noi'],['fac','afc tac fac fae']]};
const decoupe=t=>{const o=[];t.split(/\s+/).forEach(w=>{/[\p{L}]/u.test(w)?o.push(w):o[o.length-1]+=' '+w});return o};
const pied=(t,n)=>`<div class="pied"><span>${t}</span><span>toujourscap.com · CC BY-NC-SA 4.0 · ${n}</span></div>`;
const ent=`<div class="ent"><span>Niveau :</span><span>Né(e) en (mois / année) :</span><span>Âge :</span><span>Date :</span></div>`;
const cases=(l,cl)=>`<div class="cases ${cl}">${l.map((x,i)=>`<div class="num" data-n="${i+1}">${x}</div>`).join('')}</div>`;
const grille=(l,titre,cons)=>`<h2>${titre}</h2><div class="consigne">${cons}</div><table><tr><th>Item</th><th>✔</th><th>≈</th><th>✘</th><th>Ce que l'élève a dit</th></tr>${l.map(x=>`<tr><td class="it">${x}</td><td class="cc">□</td><td class="cc">□</td><td class="cc">□</td><td></td></tr>`).join('')}</table><div class="tot">Score (✔ + ≈) : <b></b> / ${l.length} · Durée : <b></b></div>`;
const texteNum=t=>decoupe(t).map((w,i)=>`${w}<sup>${i+1}</sup>`).join(' ');
const fluence=(titre,t)=>`<h2>${titre} <span class="tag">${decoupe(t).length} mots</span></h2><div class="consigne">Chrono 1 minute. Barrez les mots mal lus (un mot autocorrigé n'est pas une erreur). Mettez « ] » après le dernier mot lu à 1 min.</div>
<div class="texteA">${texteNum(t)}</div><div class="calc"><div>Mots lus :<br></div><div>Erreurs :<br></div><div>Temps (s) :<br></div><div>MCLM = (lus − erreurs) × 60 ÷ temps<br></div></div>`;

const PAGES={
eleve:[
 `<div class="page"><h1>Lire des sons <span class="tag e">Élève</span></h1>
  <h2>1. Voyelles simples</h2>${cases(VS,'c-lettres')}
  <h2>2. Voyelles complexes</h2>${cases(VC,'c-graph')}${pied('Planche élève 1','1')}</div>`,
 `<div class="page"><h1>Lire des mots <span class="tag e">Élève</span></h1>
  <h2>3. Mots simples</h2>${cases(MS,'c-mots')}
  <h2>4. Mots avec des sons complexes</h2>${cases(MC,'c-mots')}${pied('Planche élève 2','2')}</div>`,
 `<div class="page"><h1>Lire des textes <span class="tag e">Élève</span></h1>
  <h2>5. Titi la tortue</h2><div class="texteE grand">${TS}</div>
  <h2>6. Pompon le lapin</h2><div class="texteE">${TC}</div>${pied('Planche élève 3','3')}</div>`,
 `<div class="page"><h1>Montre la même <span class="tag e">Élève</span></h1>
  <div class="consigne">Regarde la lettre dans le cadre jaune. Montre (ou entoure) la même sur la ligne.</div>
  ${VIS.map(([m,c],i)=>`<div class="ligneChoix"><span class="n">${i+1}</span><span class="mod">${m}</span><span class="ch">${c.split(' ').map(x=>`<span>${x}</span>`).join('')}</span></div>`).join('')}
  ${pied('Planche élève 4 — discrimination visuelle','4')}</div>`,
 `<div class="page"><h1>Écoute bien <span class="tag e">Élève</span></h1>
  <h2>7. Par quelle lettre commence le mot ?</h2><div class="grosses"><span>b</span><span>d</span><span>p</span><span>q</span></div>
  <h2>8. Pareil ou différent ?</h2><div class="pareil"><div>=</div><div>≠</div></div>
  <h2>9. Empan : montre ce que tu as vu</h2>
  <div class="empanE">${[1,2,3].map(n=>`<div><b>${n} lettre${n>1?'s':''}</b>${EMP[n].map(([m,c],i)=>`<div class="ligneChoix"><span class="n">${n}.${i+1}</span><span class="ch">${c.split(' ').map(x=>`<span>${x}</span>`).join('')}</span></div>`).join('')}</div>`).join('')}</div>
  ${pied('Planche élève 5 — auditif et empan','5')}</div>`],
adulte:[
 `<div class="page"><h1>Feuille de passation <span class="tag">Adulte</span></h1>${ent}
  <div class="consigne">✔ juste · ≈ hésitant ou autocorrigé (compté juste) · ✘ erreur. Acquis ≥ 80 % · en cours 50–79 % · non acquis &lt; 50 %.</div>
  <div class="cols"><div>${grille(VS,'1. Voyelles simples',"« Dis-moi le son de cette lettre. » (y = [i])")}</div><div>${grille(VC,'2. Voyelles complexes',"« Quel son font ces lettres ensemble ? » en = [an] ou [in] acceptés.")}</div></div>
  ${pied('Feuille de passation 1','6')}</div>`,
 `<div class="page"><h1>Feuille de passation <span class="tag">Adulte</span></h1>
  <div class="cols"><div>${grille(MS,'3. Mots simples',"« Lis ce mot. » Syllabation lente = ≈")}</div><div>${grille(MC,'4. Mots complexes',"« Lis ce mot. »")}</div></div>
  ${pied('Feuille de passation 2','7')}</div>`,
 `<div class="page"><h1>Feuille de passation <span class="tag">Adulte</span></h1>
  ${fluence('5. Texte simple — Titi la tortue',TS)}${fluence('6. Texte complexe — Pompon le lapin',TC)}
  <div class="tot">Repères de fin d'année (Éduscol, mots correctement lus / min) : CP 50 · CE1 70 · CE2 90.</div>
  ${pied('Feuille de passation 3','8')}</div>`,
 `<div class="page"><h1>Feuille de passation <span class="tag">Adulte</span></h1>
  <div class="cols serre"><div>
  <h2>7. b, d, p, q visuel</h2><div class="consigne">L'élève montre le même modèle (planche 4). Notez sa réponse.</div>
  <table><tr><th>N°</th><th>Modèle</th><th>Réponse</th><th>✔/✘</th></tr>${VIS.map(([m],i)=>`<tr><td>${i+1}</td><td class="it">${m}</td><td></td><td></td></tr>`).join('')}</table><div class="tot">Score : <b></b> / ${VIS.length}</div>
  <h2>9. Pareil / différent</h2><div class="consigne">Dites les deux mots, bouche cachée. L'élève montre = ou ≠.</div>
  <table><tr><th>Mots à dire</th><th>Attendu</th><th>✔/✘</th></tr>${PAR.map(([a,b])=>`<tr><td>${a} – ${b}</td><td>${a===b?'=':'≠'}</td><td></td></tr>`).join('')}</table><div class="tot">Score : <b></b> / ${PAR.length}</div>
  </div><div>
  <h2>8. b, d, p, q auditif</h2><div class="consigne">Dites le mot. « Par quelle lettre commence-t-il ? » L'élève montre sur la planche 5.</div>
  <table><tr><th>Mot à dire</th><th>Attendu</th><th>Réponse</th><th>✔/✘</th></tr>${AUD.map(([m,l])=>`<tr><td>${m}</td><td>${l}</td><td></td><td></td></tr>`).join('')}</table><div class="tot">Score : <b></b> / ${AUD.length}</div>
  <h2>10. Empan visuel</h2><div class="consigne">Montrez la carte environ ½ seconde puis cachez-la. L'élève montre sa réponse sur la ligne correspondante (planche 5).</div>
  <table><tr><th>N°</th><th>Carte</th><th>Réponse</th><th>✔/✘</th></tr>${[1,2,3].map(n=>EMP[n].map(([m],i)=>`<tr><td>${n}.${i+1}</td><td class="it">${m}</td><td></td><td></td></tr>`).join('')).join('')}</table>
  <div class="tot">1 lettre : <b></b>/5 · 2 lettres : <b></b>/5 · 3 lettres : <b></b>/5</div>
  </div></div>${pied('Feuille de passation 4','9')}</div>`],
cartes:[
 `<div class="page"><h1>Cartes empan à découper <span class="tag">Adulte</span></h1>
  <div class="consigne">Collez-les sur du carton. Montrez chaque carte ½ seconde (le temps de dire « hop »), puis retournez-la.</div>
  <div class="cartes">${[1,2,3].map(n=>EMP[n].map(([m],i)=>`<div><small>${n}.${i+1}</small>${m}</div>`).join('')).join('')}</div>
  ${pied('Cartes empan','10')}</div>`],
bilan:[
 `<div class="page"><h1>Fiche bilan de lecture</h1>${ent}
  <table><tr><th>Épreuve</th><th>Score</th><th>Acquis</th><th>En cours</th><th>Non acquis</th><th>Erreurs / remarques</th></tr>
  ${['Voyelles simples /9','Voyelles complexes /16','Mots simples /16','Mots complexes /16','Texte simple (MCLM)','Texte complexe (MCLM)','b d p q visuel /14','b d p q auditif /12','Pareil / différent /8','Empan 1 lettre /5','Empan 2 lettres /5','Empan 3 lettres /5'].map(x=>`<tr><td>${x}</td><td style="width:18mm"></td><td class="cc">□</td><td class="cc">□</td><td class="cc">□</td><td style="height:8mm"></td></tr>`).join('')}</table>
  <h2>Points d'appui</h2><div class="lignes"><div></div><div></div><div></div></div>
  <h2>Difficultés observées</h2><div class="lignes"><div></div><div></div><div></div></div>
  <h2>Pistes de travail</h2><div class="lignes"><div></div><div></div><div></div></div>
  ${pied('Fiche bilan','11')}</div>`]
};
const doc=document.getElementById('doc');
function rendre(){doc.innerHTML=[...document.querySelectorAll('[data-p]')].filter(c=>c.checked).map(c=>PAGES[c.dataset.p].join('')).join('')}
document.querySelectorAll('[data-p]').forEach(c=>c.onchange=rendre);
document.getElementById('impr').onclick=()=>{try{window.print()}catch(e){document.getElementById('msg').textContent="Impression impossible dans cet aperçu : elle marchera sur le site."}};
rendre();
</script>
</body>
</html>
