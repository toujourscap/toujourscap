<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Téléprompteur de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lexend:wght@400;600&display=swap">
<style>
/* Le texte reste immobile pendant la lecture d'une ligne : un trait sous la ligne avance mot après mot,
   puis le texte monte d'un coup à la ligne suivante. Réglages dessous, éditeur de texte repliable. */
:root{
  --paper:#f3f1ea; --ink:#1f2a26; --muted:#5d6b65; --line:#d9d6cb;
  --board:#22352f; --chalk:#f4f2e8; --chalk-dim:rgba(244,242,232,.30);
  --band:#f2c94c; --mark:#ff9b45; --accent:#1f6f5c; --accent-ink:#ffffff; --field:#ffffff;
  --text:"Andika","Comic Sans MS",system-ui,sans-serif;
  --ui:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151b19; --ink:#e7ece9; --muted:#9fb0a8; --line:#2c3833;
  --board:#0f1a17; --chalk:#f1efe4; --chalk-dim:rgba(241,239,228,.28);
  --band:#e8bd3f; --mark:#ffa45c; --accent:#4bb394; --accent-ink:#0d1714; --field:#1d2522; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151b19; --ink:#e7ece9; --muted:#9fb0a8; --line:#2c3833;
  --board:#0f1a17; --chalk:#f1efe4; --chalk-dim:rgba(241,239,228,.28);
  --band:#e8bd3f; --mark:#ffa45c; --accent:#4bb394; --accent-ink:#0d1714; --field:#1d2522; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font-weight:600;font-size:20px;margin:0;text-wrap:balance}

/* Le tableau */
.stage{position:relative;height:min(58vh,440px);min-height:260px;background:var(--board);border-radius:14px;overflow:hidden}
.stage:fullscreen{height:100%;border-radius:0}
.scroller{position:absolute;left:0;right:0;top:0;padding:0 6%;transition:transform .35s ease}
.scroller p{margin:0 0 .6em;font-family:var(--text);color:var(--chalk);line-height:1.5}
.w.past{color:var(--chalk-dim)}
.band{position:absolute;left:0;right:0;pointer-events:none;border-block:3px solid var(--band);background:rgba(242,201,76,.08)}
.prog{position:absolute;height:7px;border-radius:4px;background:var(--mark);pointer-events:none;box-shadow:0 0 8px rgba(255,155,69,.55)}
.prog::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--mark)}
.fade{position:absolute;left:0;right:0;pointer-events:none}
.fade.bottom{bottom:0;background:linear-gradient(transparent,var(--board))}
.count{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:min(30vh,180px);color:var(--band);background:rgba(0,0,0,.35)}
.done{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:15px;color:var(--board);background:var(--band);padding:6px 14px;border-radius:999px;white-space:nowrap}

/* Commandes */
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--ui);font-size:16px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:46px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:130px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--band);outline-offset:2px}
.sliders{display:flex;flex-wrap:wrap;gap:10px 22px;flex:1;min-width:0}
.ctl{display:flex;flex-direction:column;gap:2px;min-width:170px;flex:1}
.ctl label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}

details{border:1px solid var(--line);border-radius:12px;background:var(--field)}
summary{cursor:pointer;padding:12px 14px;font-weight:600}
.edit{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px}
textarea{width:100%;min-height:150px;font-family:var(--text);font-size:17px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
.meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.scroller{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Téléprompteur de lecture</h1>

  <div class="stage" id="stage" aria-label="Texte à lire">
    <div class="scroller" id="scroller"></div>
    <div class="fade bottom" id="fadeBottom"></div>
    <div class="band" id="band"></div>
    <div class="prog" id="prog"></div>
    <div class="count" id="count" hidden></div>
    <div class="done" id="done" hidden>Bravo, texte terminé !</div>
  </div>

  <div class="controls">
    <div class="btns">
      <button class="primary" id="play" type="button">▶ Lire</button>
      <button id="restart" type="button">↺ Recommencer</button>
      <button id="full" type="button">⛶ Plein écran</button>
    </div>
    <div class="sliders">
      <div class="ctl">
        <label for="speed">Vitesse <output id="speedOut">50 mots/min</output></label>
        <input id="speed" type="range" min="15" max="160" step="5" value="50">
      </div>
      <div class="ctl">
        <label for="size">Taille du texte <output id="sizeOut">40 px</output></label>
        <input id="size" type="range" min="24" max="80" step="2" value="40">
      </div>
    </div>
  </div>
  <p class="hint">Le trait orange avance sous les mots : l'élève lit au même rythme. Barre d'espace : lire / pause. Flèches haut et bas : ligne précédente ou suivante.</p>

  <details id="editor">
    <summary>Changer le texte</summary>
    <div class="edit">
      <textarea id="txt" aria-label="Texte à lire"></textarea>
      <div class="btns">
        <button class="primary" id="apply" type="button">Utiliser ce texte</button>
        <button id="clear" type="button">Effacer</button>
      </div>
      <span class="meta" id="meta"></span>
    </div>
  </details>
</div>

<script>
(function(){
  const SAMPLE = "Le petit hérisson se réveille au fond du jardin.\nIl a faim. Il cherche des vers sous les feuilles mortes.\nUn merle passe et lui dit bonjour.\n« Où vas-tu si tôt ? » demande le merle.\n« Je vais au potager, répond le hérisson. Les fraises sont mûres ! »\nMais le potager est fermé par une grande barrière.\nLe hérisson se fait tout petit et passe dessous.\nIl trouve une fraise rouge et sucrée.\nIl la mange lentement, puis il rentre dormir sous le tas de bois.";

  const $ = id => document.getElementById(id);
  const stage=$("stage"), scroller=$("scroller"), band=$("band"), prog=$("prog"), count=$("count"), done=$("done");
  const play=$("play"), speed=$("speed"), size=$("size"), txt=$("txt");

  let text = SAMPLE;
  try { const saved = localStorage.getItem("tp-text"); if (saved) text = saved; } catch(e){}
  txt.value = text;

  // spans : un par mot ; weight : durée relative du mot (les mots longs prennent un peu plus de temps)
  let spans = [], weight = [], lines = [], lineOf = [];
  let pos = 0;              // position en « mots » (fractionnaire : 2,5 = milieu du 3e mot)
  let running = false, raf = 0, last = 0, countTimer = 0, curLine = -1, bandTop = 0;

  function render(){
    scroller.innerHTML = ""; spans = []; weight = [];
    text.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
      const p = document.createElement("p");
      line.split(/(\s+)/).forEach(tok=>{
        if (!tok) return;
        if (/^\s+$/.test(tok)){ p.appendChild(document.createTextNode(" ")); return; }
        const s = document.createElement("span"); s.className = "w"; s.textContent = tok;
        p.appendChild(s); spans.push(s);
        weight.push(tok.replace(/[^\p{L}\p{N}]/gu,"").length);
      });
      scroller.appendChild(p);
    });
    // Ponctuation seule (« » ? !) : durée nulle ; sinon poids normalisé autour de 1.
    const real = weight.filter(n=>n>0), avg = real.length ? real.reduce((a,b)=>a+b,0)/real.length : 1;
    weight = weight.map(n => n ? (n+3)/(avg+3) : 0);
    $("meta").textContent = real.length + " mots";
    pos = 0; layout();
  }

  // Regroupe les mots par ligne affichée (dépend de la taille du texte et de la largeur).
  function measure(){
    lines = []; lineOf = [];
    spans.forEach((s,i)=>{
      const top = s.offsetTop, L = lines[lines.length-1];
      if (!L || Math.abs(top - L.top) > s.offsetHeight/2) lines.push({top, h:s.offsetHeight, first:i, last:i});
      else L.last = i;
      lineOf[i] = lines.length-1;
    });
  }

  function layout(){
    const fs = +size.value;
    scroller.style.fontSize = fs + "px";
    $("sizeOut").textContent = fs + " px";
    const h = stage.clientHeight;
    bandTop = Math.round(h*0.33);
    scroller.style.paddingTop = bandTop + "px";
    scroller.style.paddingBottom = h + "px";
    $("fadeBottom").style.height = Math.round(h*0.22) + "px";
    measure();
    curLine = -1; draw(true);
  }

  function idx(){ return Math.min(spans.length-1, Math.floor(pos)); }

  function draw(force){
    if (!spans.length) return;
    const i = idx(), li = lineOf[i], L = lines[li];
    const finished = pos >= spans.length;
    if (li !== curLine || force){
      curLine = li;
      const y = L.top - bandTop;
      scroller.style.transform = "translateY(" + (-y) + "px)";
      const pad = Math.round(L.h*0.12);
      band.style.top = (bandTop - pad - 3) + "px";
      band.style.height = (L.h + pad*2 + 6) + "px";
      prog.style.top = (bandTop + L.h + pad - 2) + "px";
      spans.forEach((s,k)=> s.classList.toggle("past", lineOf[k] < li));
    }
    // Le trait part du début de la ligne et s'arrête là où l'élève devrait en être dans le mot en cours.
    const first = spans[L.first], cur = spans[i];
    const frac = finished ? 1 : pos - i;
    const left = first.offsetLeft;
    const right = cur.offsetLeft + cur.offsetWidth * frac;
    prog.style.left = left + "px";
    prog.style.width = Math.max(0, right - left) + "px";
  }

  function tick(t){
    if (running !== true) return;
    const dt = last ? Math.min(0.1,(t-last)/1000) : 0; last = t;
    let budget = dt * (+speed.value/60);   // temps disponible, en « mots moyens »
    while (budget > 0 && pos < spans.length){
      const i = Math.floor(pos), w = weight[i];
      if (w === 0){ pos = i+1; continue; }
      const left = (1 - (pos - i)) * w;
      if (budget >= left){ budget -= left; pos = i+1; }
      else { pos += budget / w; budget = 0; }
    }
    if (pos >= spans.length){ pos = spans.length; draw(); stop(); done.hidden = false; return; }
    draw(); raf = requestAnimationFrame(tick);
  }

  function start(){
    done.hidden = true;
    if (pos >= spans.length){ pos = 0; draw(true); }
    play.textContent = "⏸ Pause";
    if (pos === 0){
      let n = 3; count.hidden = false; count.textContent = n; running = "count";
      countTimer = setInterval(()=>{ n--; if (n>0) count.textContent = n; else { clearInterval(countTimer); countTimer=0; count.hidden=true; go(); } }, 700);
    } else go();
  }
  function go(){ running = true; last = 0; raf = requestAnimationFrame(tick); }
  function stop(){
    running = false; cancelAnimationFrame(raf);
    if (countTimer){ clearInterval(countTimer); countTimer=0; count.hidden=true; }
    play.textContent = "▶ Lire";
  }
  function toggle(){ running ? stop() : start(); }
  function goLine(d){
    if (!spans.length) return;
    const li = Math.max(0, Math.min(lines.length-1, lineOf[idx()] + d));
    pos = lines[li].first; done.hidden = true; draw();
  }

  play.addEventListener("click", toggle);
  $("restart").addEventListener("click", ()=>{ stop(); pos = 0; done.hidden = true; draw(true); });
  speed.addEventListener("input", ()=>{ $("speedOut").textContent = speed.value + " mots/min"; });
  size.addEventListener("input", layout);
  $("apply").addEventListener("click", ()=>{
    const v = txt.value.trim(); if (!v) return;
    text = v; try{ localStorage.setItem("tp-text", v); }catch(e){}
    stop(); done.hidden = true; render(); $("editor").open = false; stage.scrollIntoView({block:"nearest"});
  });
  $("clear").addEventListener("click", ()=>{ txt.value = ""; txt.focus(); });
  $("full").addEventListener("click", ()=>{
    try{ document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen().catch(()=>{}); }catch(e){}
  });
  document.addEventListener("fullscreenchange", ()=>setTimeout(layout,50));
  window.addEventListener("resize", layout);
  document.addEventListener("keydown", e=>{
    if (e.target === txt) return;
    if (e.code === "Space"){ e.preventDefault(); toggle(); }
    else if (e.key === "ArrowDown"){ e.preventDefault(); goLine(1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); goLine(-1); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  render();
})();
</script>
</body>
</html>
