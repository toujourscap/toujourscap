<style>

.pastille{display:inline-block;padding:1px 9px;border-radius:20px;color:#fff;font-size:.85rem;white-space:nowrap}
.p-a{background:var(--vert)}.p-e{background:var(--orange)}.p-n{background:var(--rouge)}
.note{color:var(--doux);font-size:.88rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
pre{white-space:pre-wrap;font-family:inherit;background:#faf6ee;border-radius:10px;padding:12px;margin:0}
.histo li{margin:4px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const melange=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hasard=a=>a[Math.random()*a.length|0];
// Écriture mathématique : « 3/8 » devient une vraie fraction, « … » une case vide.
const mx=s=>esc(s).replace(/(\d+)\/(\d+)/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/ …/g,' <span class="trou"></span>');
const nb=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ---------- Dessins (SVG) ---------- */
const svg=(w,h,c)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Andika,Arial,sans-serif">${c}</svg>`;
const ORANGE='#f6a21a',ROUGE2='#e35d5d',TRAIT='#2c3440';
function frac(n,k,forme,reste){
 const coul=i=>i<k?ORANGE:(reste?ROUGE2:'#fff');
 if(forme==='disque'){let c='';for(let i=0;i<n;i++){const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2;
   const p=(a)=>[(100+80*Math.cos(a)).toFixed(1),(100+80*Math.sin(a)).toFixed(1)];const [x0,y0]=p(a0),[x1,y1]=p(a1);
   c+=n===1?`<circle cx="100" cy="100" r="80" fill="${coul(i)}" stroke="${TRAIT}" stroke-width="3"/>`:`<path d="M100 100 L${x0} ${y0} A80 80 0 ${1/n>.5?1:0} 1 ${x1} ${y1} Z" fill="${coul(i)}" stroke="${TRAIT}" stroke-width="3" stroke-linejoin="round"/>`}
  return svg(200,200,c)}
 const W=n>6?440:360,w=W/n;let c='';
 for(let i=0;i<n;i++)c+=`<rect x="${10+i*w}" y="10" width="${w}" height="90" fill="${coul(i)}" stroke="${TRAIT}" stroke-width="3"/>`;
 return svg(W+20,110,c)}
function horloge(h,m){
 let c=`<circle cx="110" cy="110" r="100" fill="#fff" stroke="${TRAIT}" stroke-width="6"/>`;
 for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?90:84;c+=`<line x1="${110+r1*Math.sin(a)}" y1="${110-r1*Math.cos(a)}" x2="${110+96*Math.sin(a)}" y2="${110-96*Math.cos(a)}" stroke="${TRAIT}" stroke-width="${i%5?1.5:3.5}"/>`}
 for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;c+=`<text x="${110+70*Math.sin(a)}" y="${110-70*Math.cos(a)+9}" font-size="25" text-anchor="middle" fill="${TRAIT}">${i}</text>`}
 const ah=((h%12)+m/60)*30,am=m*6;
 c+=`<line x1="110" y1="110" x2="110" y2="58" stroke="#24527a" stroke-width="9" stroke-linecap="round" transform="rotate(${ah} 110 110)"/>`;
 c+=`<line x1="110" y1="110" x2="110" y2="28" stroke="${ROUGE2}" stroke-width="5" stroke-linecap="round" transform="rotate(${am} 110 110)"/>`;
 c+=`<circle cx="110" cy="110" r="7" fill="${TRAIT}"/>`;
 return svg(220,220,c)}
function droite(debut,pas,n,manque){
 const W=640,x=i=>30+i*(W-60)/(n-1);let c=`<line x1="10" y1="50" x2="${W-10}" y2="50" stroke="${TRAIT}" stroke-width="3"/><path d="M${W-10} 50 l-12 -7 v14 z" fill="${TRAIT}"/>`;
 for(let i=0;i<n;i++){c+=`<line x1="${x(i)}" y1="38" x2="${x(i)}" y2="62" stroke="${TRAIT}" stroke-width="3"/>`;
  c+=i===manque?`<rect x="${x(i)-26}" y="70" width="52" height="34" rx="6" fill="#fff3c4" stroke="${ROUGE2}" stroke-width="2.5"/><text x="${x(i)}" y="97" font-size="26" text-anchor="middle" fill="${ROUGE2}" font-weight="700">?</text>`
   :`<text x="${x(i)}" y="95" font-size="${n>9?19:22}" text-anchor="middle" fill="${TRAIT}">${debut+i*pas}</text>`}
 return svg(W,112,c)}
function regle(a,b){
 const u=40,x=v=>20+v*u;let c=`<rect x="8" y="70" width="${12*u+24}" height="70" rx="6" fill="#fdf1c7" stroke="#b9a76a" stroke-width="2"/>`;
 for(let mm=0;mm<=120;mm++){const L=mm%10?(mm%5?10:16):26;c+=`<line x1="${x(mm/10)}" y1="70" x2="${x(mm/10)}" y2="${70+L}" stroke="${TRAIT}" stroke-width="${mm%10?1:2}"/>`}
 for(let v=0;v<=12;v++)c+=`<text x="${x(v)}" y="124" font-size="20" text-anchor="middle" fill="${TRAIT}">${v}</text>`;
 c+=`<line x1="${x(a)}" y1="40" x2="${x(b)}" y2="40" stroke="#2f6fb2" stroke-width="6"/><line x1="${x(a)}" y1="28" x2="${x(a)}" y2="52" stroke="#2f6fb2" stroke-width="4"/><line x1="${x(b)}" y1="28" x2="${x(b)}" y2="52" stroke="#2f6fb2" stroke-width="4"/>`;
 c+=`<line x1="${x(a)}" y1="52" x2="${x(a)}" y2="70" stroke="#2f6fb2" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="${x(b)}" y1="52" x2="${x(b)}" y2="70" stroke="#2f6fb2" stroke-width="1.5" stroke-dasharray="4 3"/>`;
 return svg(12*u+40,150,c)}
function argent(liste){
 return liste.map(v=>{
  if(/€$/.test(v)&&+v.replace('€','')>=5){const col={5:'#9aa3ad',10:'#d9826e',20:'#6d8fc9',50:'#e6a05a'}[+v.replace('€','')];
   return svg(150,82,`<rect x="3" y="3" width="144" height="76" rx="8" fill="${col}" stroke="${TRAIT}" stroke-width="2"/><rect x="12" y="12" width="126" height="58" rx="5" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/><text x="75" y="54" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">${v.replace('€',' €')}</text>`)}
  const euro=/€$/.test(v),n=v.replace(/[€c]/g,''),r=euro?(n==='2'?40:36):({50:37,20:34,10:30,5:31,2:28,1:25}[n]);
  const centre=n==='2'&&euro?'#e2b33c':euro?'#cfd3d8':(+n>=10?'#e2b33c':'#c8794a'),bord=n==='2'&&euro?'#cfd3d8':euro?'#e2b33c':centre;
  return svg(r*2+6,r*2+6,`<circle cx="${r+3}" cy="${r+3}" r="${r}" fill="${bord}" stroke="${TRAIT}" stroke-width="2"/><circle cx="${r+3}" cy="${r+3}" r="${euro?r*.7:r*.85}" fill="${centre}" stroke="rgba(0,0,0,.25)"/><text x="${r+3}" y="${r+3+(euro?10:8)}" font-size="${euro?28:22}" font-weight="700" text-anchor="middle" fill="${TRAIT}">${euro?n+' €':n+' c'}</text>`)}).join('')}
function figure(nom){
 const st=`fill="#cfe3f7" stroke="${TRAIT}" stroke-width="4" stroke-linejoin="round"`;
 const f={carre:`<rect x="55" y="25" width="110" height="110" ${st}/>`,rectangle:`<rect x="20" y="45" width="180" height="80" ${st}/>`,
  rectv:`<rect x="75" y="15" width="70" height="130" ${st}/>`,triangle:`<polygon points="25,140 195,140 125,20" ${st}/>`,disque:`<circle cx="110" cy="80" r="65" ${st}/>`,
  trect:`<polygon points="45,140 185,140 45,25" ${st}/><polyline points="45,122 63,122 63,140" fill="none" stroke="${TRAIT}" stroke-width="3"/>`,
  losange:`<polygon points="110,10 180,80 110,150 40,80" ${st}/>`}[nom];
 return svg(220,160,f)}
function solide(nom){
 const s=`stroke="${TRAIT}" stroke-width="3" stroke-linejoin="round"`;
 const f={cube:`<polygon points="40,70 140,70 140,170 40,170" fill="#7fb3e6" ${s}/><polygon points="40,70 80,35 180,35 140,70" fill="#b5d4f2" ${s}/><polygon points="140,70 180,35 180,135 140,170" fill="#5a93cc" ${s}/>`,
  pave:`<polygon points="20,85 170,85 170,165 20,165" fill="#f3b46b" ${s}/><polygon points="20,85 60,45 210,45 170,85" fill="#f8d2a4" ${s}/><polygon points="170,85 210,45 210,125 170,165" fill="#d8913f" ${s}/>`,
  cylindre:`<path d="M50 40 v110 a60 18 0 0 0 120 0 v-110" fill="#93cf9c" ${s}/><ellipse cx="110" cy="40" rx="60" ry="18" fill="#c3e6c7" ${s}/>`,
  cone:`<path d="M110 15 L45 150 a65 18 0 0 0 130 0 Z" fill="#e7a0c6" ${s}/><path d="M45 150 a65 18 0 0 1 130 0" fill="none" stroke="${TRAIT}" stroke-width="2" stroke-dasharray="6 5"/>`,
  pyramide:`<polygon points="110,15 35,150 150,165" fill="#f5d36b" ${s}/><polygon points="110,15 150,165 195,135" fill="#d9b13e" ${s}/><path d="M35 150 L80 120 L195 135 M80 120 L110 15" fill="none" stroke="${TRAIT}" stroke-width="2" stroke-dasharray="6 5"/>`,
  boule:`<defs><radialGradient id="g" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b98be0"/></radialGradient></defs><circle cx="110" cy="95" r="72" fill="url(#g)" ${s}/>`}[nom];
 return svg(220,185,f)}
function angle(deg,rot){
 const cx=60,cy=150,L=150,r=a=>a*Math.PI/180;const p=a=>[cx+L*Math.cos(r(-a)),cy+L*Math.sin(r(-a))];
 const [x1,y1]=p(rot),[x2,y2]=p(rot+deg);
 return svg(260,180,`<g transform="translate(${deg>100?60:0},0)"><line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="${TRAIT}" stroke-width="5" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="${TRAIT}" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="${TRAIT}"/></g>`)}
function points(aligne){
 const P=aligne?[[40,130],[140,90],[240,50]]:[[40,130],[140,70],[240,60]];
 return svg(280,170,P.map(([x,y],i)=>`<line x1="${x-9}" y1="${y-9}" x2="${x+9}" y2="${y+9}" stroke="${TRAIT}" stroke-width="4"/><line x1="${x-9}" y1="${y+9}" x2="${x+9}" y2="${y-9}" stroke="${TRAIT}" stroke-width="4"/><text x="${x}" y="${y+34}" font-size="22" text-anchor="middle">${'ABC'[i]}</text>`).join(''))}
function grille(lettres){
 const C=6,L=4,u=62;let c='';
 for(let i=0;i<=C;i++)c+=`<line x1="${10+i*u}" y1="10" x2="${10+i*u}" y2="${10+L*u}" stroke="#9fb3c8" stroke-width="2"/>`;
 for(let j=0;j<=L;j++)c+=`<line x1="10" y1="${10+j*u}" x2="${10+C*u}" y2="${10+j*u}" stroke="#9fb3c8" stroke-width="2"/>`;
 const t=(x,y,s,fs)=>`<text x="${10+x*u+u/2}" y="${10+y*u+u/2+fs*.36}" font-size="${fs}" text-anchor="middle" font-weight="700" fill="#24527a">${s}</text>`;
 c+=t(0,3,'🤖',40);Object.entries(lettres).forEach(([l,[x,y]])=>c+=t(x,y,l,34));
 return svg(C*u+20,L*u+20,c)}
function balance(g,d){
 return svg(320,190,`<polygon points="160,60 140,180 180,180" fill="#b98a5c" stroke="${TRAIT}" stroke-width="3"/><line x1="50" y1="88" x2="270" y2="40" stroke="${TRAIT}" stroke-width="7" stroke-linecap="round"/><circle cx="160" cy="64" r="7" fill="${TRAIT}"/>
 <path d="M10 118 h80 l-12 18 h-56 z" fill="#d6dde5" stroke="${TRAIT}" stroke-width="3"/><line x1="50" y1="88" x2="22" y2="118" stroke="${TRAIT}" stroke-width="2"/><line x1="50" y1="88" x2="78" y2="118" stroke="${TRAIT}" stroke-width="2"/><text x="50" y="113" font-size="44" text-anchor="middle">${g}</text>
 <path d="M230 70 h80 l-12 18 h-56 z" fill="#d6dde5" stroke="${TRAIT}" stroke-width="3"/><line x1="270" y1="40" x2="242" y2="70" stroke="${TRAIT}" stroke-width="2"/><line x1="270" y1="40" x2="298" y2="70" stroke="${TRAIT}" stroke-width="2"/><text x="270" y="66" font-size="30" text-anchor="middle">${d}</text>`)}
function sousTable(){
 return svg(300,190,`<rect x="40" y="60" width="220" height="16" rx="4" fill="#b98a5c" stroke="${TRAIT}" stroke-width="3"/><rect x="55" y="76" width="14" height="100" fill="#b98a5c" stroke="${TRAIT}" stroke-width="3"/><rect x="231" y="76" width="14" height="100" fill="#b98a5c" stroke="${TRAIT}" stroke-width="3"/>
 <text x="110" y="54" font-size="48" text-anchor="middle">🐱</text><text x="200" y="54" font-size="40" text-anchor="middle">📕</text><text x="150" y="172" font-size="46" text-anchor="middle">⚽</text>`)}
const TRANSPORTS=[['À pied',12,9],['À vélo',7,18],['En voiture',10,8],['En bus',5,6]];
const tableau=()=>`<table class="tab"><tr><th>Comment viens-tu à l'école ?</th><th>Filles</th><th>Garçons</th></tr>${TRANSPORTS.map(([a,f,g])=>`<tr><th>${a}</th><td>${f}</td><td>${g}</td></tr>`).join('')}</table>`;
const FRUITS=[['🍎','pomme',6],['🍌','banane',9],['🍓','fraise',4],['🍊','orange',2]];
function barres(){
 const H=10,u=24,x0=50,y0=20+H*u;let c=`<text x="12" y="16" font-size="16" fill="${TRAIT}">élèves</text>`;

 for(let k=0;k<u;k++)c+=`<rect x="${20+d*30+(k%3)*28}" y="${143-Math.floor(k/3)*28}" width="20" height="19" fill="#f6a21a" stroke="${TRAIT}" stroke-width="2"/>`;
 return svg(Math.max(120,30+d*30+90),210,c)}

function tablesAddCP(){const out=[],vu=new Set();let g=0;while(out.length<24&&g++<600){const a=Math.random()*11|0,b=Math.random()*11|0,s=a+b,k=Math.random()*4|0;
 const t=[[`${a} + … = ${s}`,b],[`… + ${b} = ${s}`,a],[`${s} = ${a} + …`,b],[`${a} + ${b} = …`,s]][k];if(vu.has(t[0])||a===0||b===0)continue;vu.add(t[0]);out.push(V(t[0],t[1]))}return out}

function stopTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function dire(t){try{const u=new SpeechSynthesisUtterance(t.replace(/−/g,'moins').replace(/×/g,'fois'));u.lang='fr-FR';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function cache(vu,son){return `<div class="cache noprint"><button class="b" id="voir">👁 Maintenir pour voir la réponse</button><span class="mot-cache" id="mot">${esc(vu)}</span>${son?'<button class="b" id="dire">🔊 Faire écouter</button>':''}</div>`}
function lierCache(t){if(!$('#voir'))return;const v=$('#voir'),m=$('#mot');
 v.addEventListener('pointerdown',e=>{e.preventDefault();m.classList.add('vu')});['pointerup','pointerleave','pointercancel'].forEach(x=>v.addEventListener(x,()=>m.classList.remove('vu')));
 if($('#dire'))$('#dire').onclick=()=>dire(t)}
function majEntete(){$('#hdrInfo').textContent=[reglages.version?'Version '+VERSIONS[reglages.version].court:'',reglages.prenom,reglages.classe,ageTexte(ageMois()),dateFr(reglages.date)].filter(Boolean).join(' · ')}
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
// Sans mois de naissance (facultatif), l'âge est estimé au milieu de l'année (juillet).
function ageMois(m=reglages.moisN,a=reglages.anneeN,d=reglages.date){if(!a||!d)return null;m=m||7;const [y,mo]=d.split('-').map(Number);const n=(y-a)*12+(mo-m);return n>=36&&n<=144?n:null}
function ageTexte(n,approx=!reglages.moisN){return n==null?'':approx?'environ '+Math.floor(n/12)+' ans':Math.floor(n/12)+' ans'+(n%12?' '+(n%12)+' mois':'')}
const API='/api/bilan-maths';
function dateFr(d){if(!d)return'';const [y,m,j]=d.split('-');return j+'/'+m+'/'+y}
function duree(s){s=Math.round(s);return s<60?s+' s':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'}
document.addEventListener('keydown',e=>{if(onKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))onKey(e)});
const lireHisto=()=>{try{return JSON.parse(localStorage.getItem('bilanMathsCE1')||'[]')}catch(e){return[]}};
const ecrireHisto=h=>{try{localStorage.setItem('bilanMathsCE1',JSON.stringify(h.slice(0,15)))}catch(e){}};

/* ---------- Accueil ---------- */
function accueil(){
 stopTimers();onKey=null;R=null;
 const groupes=[...new Set(EPREUVES.map(e=>e.groupe))];
 const h=lireHisto();
 app.innerHTML=`
 <div class="carte">
  <h2>1. L'élève</h2>
  <p class="note" style="margin-top:0">Deux versions : <b>début de CE1</b> (objectifs de fin de CP) et <b>fin de CE1 – début de CE2</b> (objectifs de fin de CE1). Les épreuves suivent le programme de mathématiques du cycle 2 (BO n°41 du 31 octobre 2024). L'élève répond à l'oral ou montre sa réponse, l'adulte valide. À la fin, seuls le niveau, l'âge et les scores sont enregistrés (anonymement) pour calculer les moyennes du site. Le prénom n'est jamais enregistré. Dès que l'élève réussit les premiers items sans erreur (5 au plus), l'épreuve est jugée acquise et on passe automatiquement à la suivante.</p>
  <div class="grille">
   <label>Moment du bilan <b style="color:var(--rouge)">*</b><br><select id="version"><option value="">— choisir —</option><option value="debut" ${reglages.version==='debut'?'selected':''}>Début de CE1 (acquis de fin de CP)</option><option value="fin" ${reglages.version==='fin'?'selected':''}>Fin de CE1 – début de CE2</option></select></label>
   <label>Niveau <b style="color:var(--rouge)">*</b><br><select id="classe"><option value="">— choisir —</option>${['CP','CE1','CE2','Autre'].map(c=>`<option ${c===reglages.classe?'selected':''}>${c}</option>`).join('')}</select></label>
   <label>Mois de naissance (facultatif)<br><select id="moisN"><option value="">— mois —</option>${MOIS.map((m,i)=>`<option value="${i+1}" ${i+1==reglages.moisN?'selected':''}>${m}</option>`).join('')}</select></label>
   <label>Année de naissance <b style="color:var(--rouge)">*</b><br><select id="anneeN"><option value="">— année —</option>${Array.from({length:10},(_,i)=>new Date().getFullYear()-4-i).map(a=>`<option ${a==reglages.anneeN?'selected':''}>${a}</option>`).join('')}</select></label>
   <label>Date de la passation<br><input type="date" id="date" value="${reglages.date}"></label>
   <label>Âge le jour du test<br><b id="age" style="font-size:1.2rem">—</b></label>
   <label>Prénom (facultatif)<br><input type="text" id="prenom" value="${esc(reglages.prenom)}" placeholder="affiché, jamais enregistré"></label>
  </div>
 </div>
 <div class="carte">
  <h2>2. Épreuves — ${reglages.version?VERSIONS[reglages.version].lab+' ('+VERSIONS[reglages.version].titre+')':'choisissez d\'abord le moment du bilan'}</h2>
  <p class="note" style="margin-top:0">Tout le bilan prend environ 45 minutes : il peut se faire en deux ou trois fois (cochez seulement quelques domaines). Prévoyez une feuille, un crayon, une règle et une équerre.</p>
  <div class="grille" ${reglages.version?'':'style="display:none"'}>${groupes.map(g=>`<div class="groupe"><h3><label title="Tout cocher ou tout décocher dans ce groupe"><input type="checkbox" class="tg"> ${g}</label></h3>${EPREUVES.filter(e=>e.groupe===g).map(e=>`<label><input type="checkbox" class="ep" value="${e.id}" ${reglages.choisies.includes(e.id)?'checked':''}> ${e.titre}</label>`).join('')}</div>`).join('')}</div>
  <div class="actions"><button class="b petit" id="tout">Tout cocher</button><button class="b petit" id="rien">Tout décocher</button></div>
  <h3>Réglages</h3>
  <div class="grille"><label><input type="checkbox" id="alea" ${reglages.aleatoire?'checked':''}> Items dans le désordre</label></div>
  <div class="actions"><button class="b prim" id="go">▶ Commencer le bilan</button></div>
 </div>
 ${h.length?`<div class="carte noprint"><h2>Bilans enregistrés sur cet appareil</h2><ul class="histo">${h.map((x,i)=>`<li>${esc(x.titre)} <button class="b petit" data-voir="${i}">Voir</button></li>`).join('')}</ul><button class="b petit" id="effacer">Effacer la liste</button></div>`:''}
 <p class="note">${VERSIONS[reglages.version||'debut'].reperes}</p>`;
 $('#version').onchange=()=>{lireForm();reglages.version=$('#version').value;EPREUVES=VERSIONS[reglages.version||'debut'].ep;reglages.choisies=EPREUVES.map(e=>e.id);accueil()};
 const majAge=()=>{const n=ageMois($('#moisN').value,$('#anneeN').value,$('#date').value);$('#age').textContent=n==null?'—':ageTexte(n,!$('#moisN').value)};
 ['moisN','anneeN','date'].forEach(id=>$('#'+id).addEventListener('change',majAge));majAge();
 const majGroupes=()=>$$('.groupe').forEach(g=>{const e=[...g.querySelectorAll('input.ep')],n=e.filter(c=>c.checked).length,t=g.querySelector('input.tg');t.checked=n===e.length;t.indeterminate=n>0&&n<e.length});
 $$('.groupe input.tg').forEach(t=>t.onchange=()=>{t.closest('.groupe').querySelectorAll('input.ep').forEach(c=>c.checked=t.checked);majGroupes()});
 $$('.groupe input.ep').forEach(c=>c.onchange=majGroupes);majGroupes();
 $('#tout').onclick=()=>{$$('.groupe input.ep').forEach(c=>c.checked=true);majGroupes()};
 $('#rien').onclick=()=>{$$('.groupe input.ep').forEach(c=>c.checked=false);majGroupes()};
 $$('[data-voir]').forEach(b=>b.onclick=()=>modal(h[b.dataset.voir].texte));
 if($('#effacer'))$('#effacer').onclick=()=>{ecrireHisto([]);accueil()};
 $('#go').onclick=()=>{
  lireForm();
  if(!reglages.version||!reglages.classe||ageMois()==null){$('#go').textContent='⚠ Indiquez le moment du bilan, le niveau, l\'année de naissance';window.scrollTo(0,0);return}
  reglages.aleatoire=$('#alea').checked;
  reglages.choisies=$$('.groupe input.ep:checked').map(c=>c.value);
  if(!reglages.choisies.length){$('#go').textContent='Cochez au moins une épreuve';return}
  majEntete();resultats={};bilanEnregistre=false;envoye=false;passation=Math.random().toString(36).slice(2,12)+Date.now().toString(36);
  R={liste:EPREUVES.filter(e=>reglages.choisies.includes(e.id)),i:0,t0:Date.now()};
  intro();
 };
}
function lireForm(){reglages.prenom=$('#prenom').value.trim();reglages.classe=$('#classe').value;reglages.date=$('#date').value;reglages.moisN=$('#moisN').value;reglages.anneeN=$('#anneeN').value;reglages.aleatoire=$('#alea').checked}
function modal(txt){
 const d=document.createElement('div');d.className='modal';
 d.innerHTML=`<div class="carte"><pre>${esc(txt)}</pre><div class="actions"><button class="b" id="mfermer">Fermer</button></div></div>`;
 document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==='mfermer')d.remove()};
}

/* ---------- Déroulé ---------- */
function intro(){
 stopTimers();
 if(R.i>=R.liste.length)return bilan();
 const ep=R.liste[R.i];R.ep=ep;
 const dejaA=R.dejaAcquis;R.dejaAcquis='';
 app.innerHTML=`<div class="barre"><span>Épreuve ${R.i+1} / ${R.liste.length}</span><button class="b petit" id="finBilan">🏁 Aller au bilan</button></div>
 <div class="carte">${dejaA?`<p class="acquis-msg">✅ « ${esc(dejaA)} » : acquis, épreuve écourtée.</p>`:''}<p class="note" style="margin:0">${ep.groupe}</p><h2>${ep.titre}</h2>
 <div class="consigne"><b>Pour l'adulte :</b> ${ep.consigne}</div>
 <div class="actions"><button class="b prim" id="start">▶ Commencer <kbd>Entrée</kbd></button><button class="b" id="passer">Passer cette épreuve</button></div></div>`;
 $('#finBilan').onclick=bilan;
 $('#passer').onclick=()=>{R.i++;intro()};
 const go=()=>{R.items=ep.items();R.k=0;R.res=[];R.tEp=Date.now();R.fin=ep.temps?Date.now()+ep.temps*1000:0;
  if(ep.temps)timers.push(setInterval(tic,250));suivant()};
 $('#start').onclick=go;
 onKey=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
}
// Chrono des épreuves de fluence : arrêt automatique.
function tic(){const c=$('#chr');if(!R||!R.fin)return;const s=Math.max(0,Math.ceil((R.fin-Date.now())/1000));
 if(c){c.textContent=duree(s);c.classList.toggle('fin',s<=10)}
 if(s<=0){R.tempsEcoule=true;finEpreuve()}}
const seuil=n=>Math.min(5,Math.ceil(n*.6));
function peutPasser(){return !R.ep.temps&&R.k<R.items.length&&R.res.length>=seuil(R.items.length)&&R.res.every(x=>x.v==='ok')}
function barre(){
 const ep=R.ep,n=R.items.length;
 return `<div class="barre"><span>${ep.groupe} · <b>${ep.titre}</b> — ${ep.temps?`${R.res.filter(x=>x.v!=='ko').length} juste${R.res.filter(x=>x.v!=='ko').length>1?'s':''} · <span class="chrono" id="chr">${duree(Math.max(0,Math.ceil((R.fin-Date.now())/1000)))}</span>`:`${Math.min(R.k+1,n)} / ${n}`}</span>
 <span><button class="b petit" id="stopEp">⏭ Arrêter l'épreuve</button> <button class="b petit" id="finBilan">🏁 Bilan</button></span></div>
 <div class="prog"><i style="width:${ep.temps?100-Math.max(0,R.fin-Date.now())/(ep.temps*10):R.k/n*100}%"></i></div>`;
}
function lierBarre(){
 $('#stopEp').onclick=()=>finEpreuve();
 if($('#acquis'))$('#acquis').onclick=()=>{R.anticipe=true;finEpreuve()};
 $('#finBilan').onclick=()=>{finEpreuve(true)};
}
function suivant(){
 if(!R.ep.temps)stopTimers();
 if(R.k>=R.items.length)return finEpreuve();
 if(peutPasser()){R.anticipe=true;R.dejaAcquis=R.ep.titre;return finEpreuve()}
 R.ep.mode==='valider'?ecranValider():ecranChoix();
}
function finEpreuve(versBilan){
 stopTimers();
 const ep=R.ep;
 if(R.res.length){
  const ok=R.res.filter(x=>x.v==='ok').length,hes=R.res.filter(x=>x.v==='hes'),err=R.res.filter(x=>x.v==='ko');
  resultats[ep.id]={titre:ep.titre,groupe:ep.groupe,prevus:R.items.length,faits:R.res.length,anticipe:!!R.anticipe,ok,hes,err,
   sec:(Date.now()-R.tEp)/1000,temps:ep.temps||0,attendu:ep.attendu||0,complet:!!(ep.temps?R.tempsEcoule||R.k>=R.items.length:R.res.length===R.items.length||R.anticipe)};
 }
 R.anticipe=false;R.tempsEcoule=false;R.fin=0;
 R.i++;
 versBilan===true?bilan():intro();
}
function enonce(it,ep){
 const q=it.q||ep.question||'';
 if(ep.taille==='s')return `<div class="stim s">${mx(q)}</div>`;
 return (it.q0?`<div class="question">${mx(it.q0)}</div>`:'')+(it.fig?`<div class="fig">${it.fig}</div>`:'')+(ep.question&&!it.q?`<div class="question">${mx(ep.question)}</div>`:'')+(q&&it.q?`<div class="${it.grand?'stim l':it.rang?'stim rang':'question'}">${mx(q)}</div>`:'');
}

/* ---------- L'adulte valide ---------- */
function ecranValider(){
 const ep=R.ep,it=R.items[R.k];
 const haut=ep.cache?cache(it.q+'  →  '+it.att,true)+`<div class="scene"><div class="question">${mx(ep.question)}</div><div class="stim l">${ep.icone}</div></div>`
  :cache(String(it.att),!!it.dire)+`<div class="scene">${ep.question?`<div class="question">${mx(ep.question)}</div>`:''}<div class="stim ${ep.taille||'l'}">${mx(it.q)}</div>${it.type?`<p class="note noprint" style="margin:14px 0 0">${esc(it.type)}</p>`:''}</div>`;
 app.innerHTML=barre()+haut+`
 <div class="adulte"><span class="lab">Adulte :</span>
  <button class="b ok" data-v="ok">✔ Juste<kbd>←</kbd></button>
  <button class="b hes" data-v="hes">≈ Hésitant / autocorrigé<kbd>↑</kbd></button>
  <button class="b ko" data-v="ko">✘ Erreur<kbd>→</kbd></button>
  <input type="text" id="rep" placeholder="Réponse de l'élève (facultatif)">
  <button class="b petit" id="retour">${R.k?'↶ Retour':'↶ Page précédente'}</button></div>`;
 lierBarre();lierCache(it.dire||it.q);
 if(ep.cache&&it.dire)timers.push(setTimeout(()=>dire(it.dire),400));
 const noter=v=>{R.res.push({item:ep.cache?it.att:it.q,v,rep:$('#rep').value.trim()});R.k++;suivant()};
 $$('.adulte [data-v]').forEach(b=>b.onclick=()=>noter(b.dataset.v));
 $('#rep').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();noter('ko')}});
 $('#retour').onclick=()=>{if(R.k){R.k--;R.res.pop();suivant()}else{stopTimers();intro()}};
 onKey=e=>{const m={ArrowLeft:'ok',ArrowUp:'hes',ArrowRight:'ko'}[e.key];if(m){e.preventDefault();noter(m)}else if(e.key==='Backspace'){e.preventDefault();$('#retour').click()}};
}

/* ---------- L'élève montre la réponse ---------- */
function ecranChoix(){
 const ep=R.ep,it=R.items[R.k];
 const emo=it.emo||it.rang||it.choix.every(c=>/^\p{Extended_Pictographic}/u.test(c));
 const cl=emo?'emo':it.choix.some(c=>c.length>6&&!/\d\/\d/.test(c))?'phr':'';
 const bout=`<div class="choix ${cl}" id="choix">${it.choix.map((c,i)=>`<button data-c="${esc(c)}">${mx(c)}<small class="num">${i+1}</small></button>`).join('')}</div>`;
 app.innerHTML=barre()+`<div class="cache noprint"><button class="b" id="dire">🔊 Lire la question</button></div><div class="scene" id="scene">${enonce(it,ep)}${bout}</div>
 <div class="adulte"><span class="lab">Adulte :</span><span>Cliquez sur la réponse que l'élève montre. <span class="note">(touches 1 à ${it.choix.length})</span></span>
 <button class="b petit" id="retour">${R.k?'↶ Retour':'↶ Page précédente'}</button></div>`;
 lierBarre();
 const lu=((it.q0?it.q0+' ':'')+(it.q||ep.question||'')).replace(/…/g,'combien');
 $('#dire').onclick=()=>dire(lu);
 $('#retour').onclick=()=>{if(R.k){R.k--;R.res.pop();suivant()}else intro()};
 let fini=false;
 const repondre=b=>{
  if(fini)return;fini=true;b.classList.add('pris');
  const c=b.dataset.c;R.res.push({item:it.q||'',v:c===it.bonne?'ok':'ko',rep:c,bonne:it.bonne});
  timers.push(setTimeout(()=>{R.k++;suivant()},300));
 };
 $$('#choix button').forEach(b=>b.onclick=()=>repondre(b));
 onKey=e=>{const n=parseInt(e.key,10);const bs=$$('#choix button');if(n>=1&&n<=bs.length)repondre(bs[n-1]);else if(e.key==='Backspace'){e.preventDefault();$('#retour').click()}};
}

/* ---------- Bilan ---------- */
function niveau(p){return p>=80?['Acquis','p-a']:p>=50?['En cours','p-e']:['Non acquis','p-n']}
const libItem=x=>String(x).replace(/ = …$/,'').replace(/ …/g,' ?').replace(/…$/,'');
function bilan(){
 stopTimers();onKey=null;
 const ids=EPREUVES.map(e=>e.id).filter(id=>resultats[id]);
 const lignes=[],texteL=[];
 const age=ageTexte(ageMois());
 const V0=VERSIONS[reglages.version];
 const titreAnon=`Bilan de maths ${V0.court} — ${reglages.classe} — ${age} — ${dateFr(reglages.date)}`;
 const titre=reglages.prenom?`Bilan de maths ${V0.court} — ${reglages.prenom} (${reglages.classe}, ${age}) — ${dateFr(reglages.date)}`:titreAnon;
 texteL.push('TITRE','');
 let grp='';
 ids.forEach(id=>{
  const r=resultats[id];
  if(r.groupe!==grp){grp=r.groupe;texteL.push('',grp.toUpperCase())}
  const juste=r.ok+r.hes.length;
  const errTxt=r.err.map(x=>x.bonne!==undefined?(x.item?libItem(x.item)+' : ':'')+`${x.rep} au lieu de ${x.bonne}`:x.rep&&x.rep!==x.item?`${libItem(x.item)} (→ ${x.rep})`:libItem(x.item)).join(' ; ');
  const hesTxt=r.hes.map(x=>libItem(x.item||x.bonne)).join(' ; ');
  let score,nv,cl,debut;
  if(r.temps){
   [nv,cl]=juste>=r.attendu?['Atteint','p-a']:juste>=r.attendu*.7?['Proche','p-e']:['En dessous','p-n'];
   score=`${juste} en ${duree(Math.min(r.sec,r.temps))}`;
   debut=`${juste} juste${juste>1?'s':''} en ${duree(Math.min(r.sec,r.temps))} (attendu ${V0.att} : ${r.attendu} en ${duree(r.temps)})`;
  }else{
   const p=Math.round(juste/r.faits*100);[nv,cl]=niveau(p);score=`${juste} / ${r.faits} (${p} %)`;
   debut=r.anticipe?`⏩ Acquis rapidement : ${r.faits} premiers items réussis sur ${r.prevus}, épreuve écourtée.`:r.faits<r.prevus?`Arrêtée après ${r.faits} items sur ${r.prevus}.`:'';
  }
  const det=[esc(debut),errTxt?`Erreurs : ${esc(errTxt)}`:'Aucune erreur.',hesTxt?`Hésitations : ${esc(hesTxt)}`:''].filter(Boolean).join('<br>');
  lignes.push(`<tr><td>${r.titre}</td><td>${score}</td><td><span class="pastille ${cl}">${nv}</span></td><td>${det}</td><td class="moy" data-e="${id}">…</td></tr>`);
  texteL.push(`- ${r.titre} : ${score} — ${nv}.`+(debut?` ${debut}`:'')+(errTxt?` Erreurs : ${errTxt}.`:'')+(hesTxt?` Hésitations : ${hesTxt}.`:''));
 });
 const tot=(Date.now()-(R?R.t0:Date.now()))/1000;
 app.innerHTML=`<div class="carte"><h2>${esc(titre)}</h2>
 ${ids.length?`<table class="res"><tr><th>Épreuve</th><th>Score</th><th>Niveau</th><th>Détails</th><th>Moyenne du site<br><span class="note">même niveau · même âge</span></th></tr>${lignes.join('')}</table>`:'<p>Aucune épreuve passée.</p>'}
 <p class="note">Durée totale de la passation : ${duree(tot)}. Niveaux : acquis ≥ 80 %, en cours 50–79 %, non acquis &lt; 50 % (les réponses hésitantes ou autocorrigées comptent comme justes). Épreuves chronométrées : nombre de réponses justes comparé aux attendus de ${V0.att} du programme 2025, à adapter selon le moment de l'année.</p>
 <h3>Observations de l'adulte</h3>
 <textarea id="obs" rows="4" style="width:100%" placeholder="Procédures utilisées (doigts, comptage, décomposition…), schémas, attitude, fatigue…"></textarea>
 <div class="actions"><button class="b prim" id="copier">📋 Copier le bilan</button><button class="b" id="impr">🖨 Imprimer</button><button class="b" id="nouveau">↺ Nouvelle passation</button></div>
 <p class="note" id="msg"></p></div>`;
 const texteFinal=(t=titre)=>texteL.join('\n').replace('TITRE',t)+($('#obs').value.trim()?'\n\nObservations : '+$('#obs').value.trim():'');
 const enregistrer=()=>{if(!ids.length)return;const h=lireHisto();if(bilanEnregistre)h.shift();h.unshift({titre:titreAnon,texte:texteFinal(titreAnon)});ecrireHisto(h);bilanEnregistre=true};
 enregistrer();envoyer(ids);
 $('#obs').addEventListener('change',enregistrer);
 $('#copier').onclick=async()=>{enregistrer();const t=texteFinal();try{await navigator.clipboard.writeText(t);$('#msg').textContent='Bilan copié : collez-le dans votre document.'}catch(e){modal(t);$('#msg').textContent='Sélectionnez le texte affiché pour le copier.'}};

// Envoi anonyme (niveau, âge en mois, scores) puis affichage des moyennes du site.
async function envoyer(ids){
 const age=ageMois(),r={};
 ids.forEach(id=>{const x=resultats[id];if(!x.complet)return;const juste=x.ok+x.hes.length;
  r[id]=x.temps?{pct:Math.min(100,Math.round(juste/x.attendu*100)),nb:juste}:{pct:Math.round(juste/x.faits*100)}});
 try{
  if(!envoye&&Object.keys(r).length){envoye=true;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({p:passation,classe:reglages.classe,age,r})})}
  const m=await (await fetch(`${API}?classe=${encodeURIComponent(reglages.classe)}&age=${age}`)).json();
  const C={},A={};(m.classe||[]).forEach(x=>C[x.epreuve]=x);(m.age||[]).forEach(x=>A[x.epreuve]=x);
  const f=(x,id)=>!x?'—':(resultats[id].temps?`${x.nb} justes`:`${x.pct} %`)+` <span class="note">(${x.n})</span>`;
  $$('td.moy').forEach(td=>{const id=td.dataset.e;td.innerHTML=`${reglages.classe} : ${f(C[id],id)}<br>${Math.floor(age/12)} ans : ${f(A[id],id)}`});
 }catch(e){$$('td.moy').forEach(td=>td.innerHTML='<span class="note">indisponible dans cet aperçu</span>')}
}
majEntete();accueil();
</script>
