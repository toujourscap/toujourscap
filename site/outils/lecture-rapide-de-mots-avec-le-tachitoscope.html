<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tachistoscope - Lis le plus de mots sans te tromper</title><link rel="canonical" href="https://toujourscap.com/post/lecture-rapide-de-mots-tachistoscope/"><meta name="description" content="Un tachistoscope en ligne : l&#x27;élève lit le plus de mots possible en 1 minute, ou sans faute jusqu&#x27;à la première erreur. Un adulte valide, ou le micro écoute…">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans','Helvetica Neue',Arial,sans-serif}
  #tachi{background:#f8f9fa;border:2px solid #dee2e6;border-radius:12px;padding:18px;max-width:820px;margin:0 auto;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  h2{font-size:1.05rem;margin:4px 0 8px;color:#495057}
  .groupe{background:#e9ecef;border-radius:8px;padding:12px;margin-bottom:12px}
  .choix{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .choix button{background:#fff;color:#212529;border:2px solid #ced4da;font-weight:600;padding:9px 14px;font-size:1rem}
  .choix button small{display:block;font-weight:400;font-size:.8rem;color:#6c757d}
  .choix button[aria-pressed="true"]{border-color:#0d6efd;background:#e7f0ff}
  button{padding:12px 22px;font-size:1.1rem;cursor:pointer;border:none;border-radius:8px;color:#fff;font-weight:bold;transition:opacity .2s,transform .1s;font-family:inherit}
  button:hover{opacity:.92} button:active{transform:scale(.98)}
  button:disabled{opacity:.4;cursor:default}
  #go{background:#198754;font-size:1.35rem;padding:14px 34px}
  #display{font-size:clamp(3.2rem,11vw,9rem);font-weight:bold;color:#212529;min-height:36vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:8px;border:1px dashed #adb5bd;margin:0 0 14px;padding:16px;word-break:break-word;position:relative}
  #display.ok{animation:ok .35s}
  @keyframes ok{0%{background:#d1e7dd}100%{background:#fff}}
  #display.ko{animation:ko .45s}
  @keyframes ko{0%{background:#f8d7da}100%{background:#fff}}
  #chrono.vite{color:#dc3545;font-weight:bold}
  .fin .erreurs{color:#6c757d;font-size:.75em}
  #compteur{position:absolute;top:8px;left:12px;font-size:1.1rem;color:#198754}
  #chrono{position:absolute;top:8px;right:12px;font-size:1.1rem;color:#6c757d}
  #barre{position:absolute;left:0;bottom:0;height:6px;background:#0d6efd;border-radius:0 0 8px 8px;width:0}
  #msg{min-height:1.6em;font-size:1.1rem;font-weight:600;margin-bottom:10px;color:#495057}
  #msg.err{color:#dc3545} #msg.warn{color:#d97706} #msg.ok{color:#198754}
  .jeu{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:12px}
  #juste{background:#198754;font-size:1.4rem;padding:16px 30px;box-shadow:0 4px 0 #11643d}
  #faux{background:#dc3545;font-size:1.4rem;padding:16px 30px;box-shadow:0 4px 0 #a71d2a}
  #stop{background:#6c757d}
  .petits #juste,.petits #faux{font-size:1rem;padding:10px 18px;box-shadow:none}
  .fin{font-size:.32em;line-height:1.35;color:#212529}
  .fin .gros{font-size:3.2em;color:#0d6efd;display:block;line-height:1.1}
  .fin .rate{color:#dc3545}
  .fin .record{color:#198754;font-size:.85em}
  label.opt{display:inline-flex;align-items:center;gap:8px;margin:6px 10px;font-size:1rem;color:#495057;cursor:pointer}
  select{font-size:1rem;padding:4px 6px;border-radius:6px;border:1px solid #ced4da}
  textarea{width:95%;height:80px;padding:10px;font-size:1rem;border:1px solid #ced4da;border-radius:6px;resize:vertical;margin-top:6px}
  #perso,#texteBloc{display:none}
  #texte{height:130px}
  #display.phrases #mot{font-size:clamp(1.5rem,4.6vw,3.3rem);line-height:1.3;max-width:94%}
  #display.phrases .fin{font-size:.75em}
  .note{font-size:.85rem;color:#6c757d;margin:6px 0 0}
  .cache{display:none!important}
  .persoBarre{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:8px}
  .petitBtn{background:#0d6efd;font-size:.9rem;padding:6px 12px}
  .petitBtn.rouge{background:#dc3545}
  #persoChoix,#texteChoix{max-width:260px}
  #persoNom,#texteNom{width:95%;margin-top:8px;padding:8px 10px;font-size:1rem;border:1px solid #ced4da;border-radius:6px;font-family:inherit}
</style>
<script src="tour-de-controle.js"></script></head>
<body>
<div id="tachi">

  <div id="reglages">
    <div class="groupe">
      <h2>1. Choisis ta liste</h2>
      <div class="choix" id="listes">
        <button data-l="1">🌱 Niveau 1<small>début de CP</small></button>
        <button data-l="2">🌿 Niveau 2<small>milieu de CP</small></button>
        <button data-l="3">🌳 Niveau 3<small>fin de CP</small></button>
        <button data-l="5">🍀 Niveau 4<small>début de CE1</small></button>
        <button data-l="4">🏔️ Niveau 5<small>fin de CE1</small></button>
        <button data-l="perso">✏️ Mes listes<small>mes mots</small></button>
        <button data-l="texte">📄 Mes textes<small>mots ou phrases</small></button>
      </div>
      <div id="perso">
        <div class="persoBarre">
          <select id="persoChoix" aria-label="Choisir une de mes listes"></select>
          <button type="button" id="persoNouv" class="petitBtn">➕ Nouvelle liste</button>
          <button type="button" id="persoPart" class="petitBtn">🔗 Partager</button>
          <button type="button" id="persoSuppr" class="petitBtn rouge">🗑️ Supprimer</button>
        </div>
        <input id="persoNom" type="text" maxlength="40" placeholder="Nom de la liste (ex. : mots du son [on], groupe de Léo…)">
        <textarea id="mots" placeholder="Écris ou colle tes mots, séparés par des espaces, des virgules ou des retours à la ligne."></textarea>
        <p class="note" id="notePerso">Les listes restent enregistrées sur cet ordinateur.</p>
      </div>
      <div id="texteBloc">
        <div class="persoBarre">
          <select id="texteChoix" aria-label="Choisir un de mes textes"></select>
          <button type="button" id="texteNouv" class="petitBtn">➕ Nouveau texte</button>
          <button type="button" id="textePart" class="petitBtn">🔗 Partager</button>
          <button type="button" id="texteSuppr" class="petitBtn rouge">🗑️ Supprimer</button>
        </div>
        <input id="texteNom" type="text" maxlength="40" placeholder="Titre du texte (ex. : Le loup et l'agneau, lecture du lundi…)">
        <textarea id="texte" placeholder="Colle ici un texte (une histoire lue en classe, une poésie, un texte du manuel…)."></textarea>
        <div class="choix" id="unites" style="margin-top:8px">
          <button data-u="mots">🔤 Lire des mots<small>au hasard dans le texte</small></button>
          <button data-u="phrases">📝 Lire des phrases<small>les phrases du texte</small></button>
        </div>
        <p class="note" id="noteTexte"></p>
      </div>
    </div>

    <div class="groupe">
      <h2>2. Choisis ton défi</h2>
      <div class="choix" id="defis">
        <button data-d="minute">⏱️ 1 minute<small>le plus de <span class="u1">mot</span>s justes</small></button>
        <button data-d="sansfaute">🎯 Sans faute<small>stop à la 1ʳᵉ erreur</small></button>
      </div>
      <p class="note" id="noteDefi"></p>
    </div>

    <div class="groupe">
      <h2>3. Qui vérifie ?</h2>
      <div class="choix" id="modes">
        <button data-m="adulte">🧑‍🏫 Un adulte valide<small>✅ juste / ❌ erreur</small></button>
        <button data-m="micro">🎤 Le micro écoute<small>Chrome, Edge ou Firefox</small></button>
      </div>
      <p class="note" id="noteMode"></p>
    </div>

    <div class="groupe">
      <label class="opt"><span>⏱️ Temps pour lire chaque <span class="u1">mot</span> :</span>
        <select id="temps">
          <option value="0">sans limite</option>
          <option value="2">2 s</option>
          <option value="3">3 s</option>
          <option value="5">5 s</option>
          <option value="8">8 s</option>
          <option value="10">10 s</option>
          <option value="15">15 s</option>
          <option value="20">20 s</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="melange" checked> <span>Mélanger les <span class="u1">mot</span>s</span></label>
      <p class="note">Le temps dépassé compte comme une erreur.</p>
    </div>
    <button id="go">▶️ Partez !</button>
  </div>

  <div id="partie" class="cache">
    <div id="display"><span id="compteur"></span><span id="chrono"></span><span id="mot">Prêt ?</span><div id="barre"></div></div>
    <div id="msg"></div>
    <div class="jeu" id="boutons">
      <button id="juste">✅ Juste</button>
      <button id="faux">❌ Erreur</button>
    </div>
    <button id="stop">⚙️ Changer de liste</button>
    <p class="note" id="aideClavier">Clavier : Espace ou → = juste, X ou ← = erreur.</p>
  </div>

</div>

<script>
(function(){
  const LISTES = {
    1: "la le il lu ma mur rat rue lit sol sur ami île lune rame mule lama lime rire papa pipe pile purée moto vélo tapis tomate tulipe salade malade radis samedi midi lavabo numéro vipère farine sirop futé pédale domino robe note vite tube date épée rapide café animal",
    2: "chat roi loup pont main lapin mouton maison bateau poule route soupe bouche chameau cadeau chocolat moulin dimanche voiture poisson ballon gâteau lundi enfant maman sapin cochon pantalon bonbon fourmi cheval marché jupon vache mouche oiseau toit noir boîte renard jambe chanson matin train lampe tambour poupée robinet souris marteau",
    3: "fille feuille soleil travail montagne araignée éléphant pharmacie garçon leçon girafe pigeon cinéma citron glace grenouille crayon tableau brouillard fleur chien loin cuisine écureuil bouteille abeille papillon famille champignon photo dauphin cerise rose valise princesse pieuvre ciseaux taxi guitare bague orange magicien réveil fauteuil nageur gorille plume trompette sorcière cheveux",
    5: "peinture ceinture copain plein frein sommeil corbeille chevreuil fenêtre forêt tempête bougie nuage orage genou caillou hibou cartable trousse cahier escalier panier tablier sanglier jardin requin pingouin coussin histoire armoire mouchoir couloir étoile brosse chaussure chaussette ruisseau pinceau couteau chapeau tortue cheminée épaule autruche boulanger lumière rivière pluie fruit juillet",
    4: "anniversaire bibliothèque ordinateur hélicoptère dictionnaire crocodile extraordinaire récréation attention addition gentiment rapidement doucement parapluie kangourou aquarium hippopotame orchestre chorale monsieur femme oignon automne album examen parfum second ville tranquille aiguille accident exemple exactement explorateur squelette kilomètre thermomètre rhinocéros yaourt journaliste quatorze vingt cinquante déguisement gymnastique magnifique escargot ascenseur piscine maintenant"
  };
  const NOMS = {1:"Niveau 1 (début CP)",2:"Niveau 2 (milieu CP)",3:"Niveau 3 (fin CP)",5:"Niveau 4 (début CE1)",4:"Niveau 5 (fin CE1)",perso:"Ma liste",texte:"Mon texte"};
  // Ce que la reconnaissance vocale écrit parfois en chiffres ou en abrégé
  const ECRITS = {"14":"quatorze","20":"vingt","50":"cinquante","2nd":"second","2e":"second","m":"monsieur","mr":"monsieur"};

  const $ = id => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  // ---------- Un texte : l'ordinateur pioche les mots (ou reprend les phrases) ----------
  function piocheMots(t){
    t = t.replace(/[’`]/g,"'");
    const re = /[A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+(?:[-'][A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+)*/g;
    const vus = new Map(); let m;
    while ((m = re.exec(t))){
      let w = m[0];
      const debut = /[.!?…:«»"—–\n]\s*$/.test(t.slice(Math.max(0,m.index-3), m.index)) || m.index===0;
      if (w.includes("'")){ const p = w.split("'"); w = p[p.length-1]; }
      if (w.length<2) continue;
      const k = w.toLowerCase();
      const e = vus.get(k) || {mot:w, min:false, propre:false, n:vus.size};
      if (w===k) e.min = true; else if (!debut) e.propre = true;
      vus.set(k, e);
    }
    return [...vus.entries()].sort((a,b)=>a[1].n-b[1].n).map(([k,e])=> (e.propre && !e.min) ? e.mot : k);
  }
  function piochePhrases(t){
    t = t.replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
    // une phrase se termine par . ! ? … suivi d'une majuscule (« Bonjour ! dit le loup. » reste une seule phrase)
    return t.split(/(?<=[.!?…][»"”)]?)\s+(?=[«"—–-]?\s*[A-ZÀ-ÖØ-ÝŒÆ0-9])/)
      .map(p=>p.replace(/^[\s—–-]+/,"").trim())
      .filter(p=>p.split(" ").filter(w=>/[a-zà-ÿ]/i.test(w)).length>=2);
  }
  let liste = store.get("tachi-liste","1"), mode = store.get("tachi-mode","adulte");
  let defi = store.get("tachi-defi","minute");
  if (defi!=="minute" && defi!=="sansfaute") defi="minute";
  const DUREE = 60;
  if (!LISTES[liste] && liste!=="perso" && liste!=="texte") liste="1";
  let unite = store.get("tachi-unite","mots"); if (unite!=="phrases") unite="mots";
  const ph_ = ()=> liste==="texte" && unite==="phrases";   // on lit des phrases ?
  const U = (n)=> (ph_()?"phrase":"mot")+(n>1?"s":"");
  const LU = (n)=> "lu"+(ph_()?"e":"")+(n>1?"s":"");
  if (mode==="micro" && !SR) mode="adulte";
  // ---------- Mes listes : plusieurs listes nommées, enregistrées sur l'ordinateur ----------
  let perso = [];
  try{ perso = JSON.parse(store.get("tachi-perso","[]")); }catch(e){ perso = []; }
  if (!Array.isArray(perso)) perso = [];
  perso = perso.filter(l=>l && typeof l.mots==="string").map(l=>({nom:String(l.nom||"").slice(0,40), mots:l.mots}));
  if (!perso.length) perso = [{nom:"Ma liste", mots:store.get("tachi-mots","maison poisson château garçon lapin bouton oiseau peinture cloche dragon")}];
  let pi = parseInt(store.get("tachi-perso-i","0"),10)||0;
  // Liste reçue par un lien de partage (?nom=…&mots=…)
  try{
    const q = new URLSearchParams(location.search), qm = q.get("mots");
    if (qm && qm.trim()){
      const qn = (q.get("nom")||"Liste partagée").slice(0,40);
      let k = perso.findIndex(l=>l.nom===qn && l.mots.trim()===qm.trim());
      if (k<0){ perso.push({nom:qn, mots:qm}); k = perso.length-1; }
      pi = k; liste = "perso"; store.set("tachi-liste","perso");
    }
  }catch(e){}
  if (pi<0 || pi>=perso.length) pi = 0;
  const nomPerso = l => l.nom.trim() || "Liste sans nom";
  function sauverPerso(){ store.set("tachi-perso", JSON.stringify(perso)); store.set("tachi-perso-i", String(pi)); }
  function remplirPerso(){
    const c = $("persoChoix"); c.innerHTML = "";
    perso.forEach((l,k)=>{ const o=document.createElement("option"); o.value=k;
      const n = l.mots.replace(/[,;]/g," ").split(/\s+/).filter(Boolean).length;
      o.textContent = nomPerso(l)+" ("+n+" mot"+(n>1?"s":"")+")"; c.appendChild(o); });
    c.value = pi;
    $("persoNom").value = perso[pi].nom;
    $("mots").value = perso[pi].mots;
    $("persoSuppr").disabled = perso.length<2 && !perso[0].mots.trim();
  }
  $("persoChoix").onchange = ()=>{ pi = parseInt($("persoChoix").value,10)||0; sauverPerso(); remplirPerso(); };
  $("persoNouv").onclick = ()=>{
    perso.push({nom:"Liste "+(perso.length+1), mots:""}); pi = perso.length-1;
    sauverPerso(); remplirPerso(); $("persoNom").select(); $("persoNom").focus();
  };
  $("persoSuppr").onclick = ()=>{
    if (!confirm("Supprimer la liste « "+nomPerso(perso[pi])+" » ?")) return;
    perso.splice(pi,1); if (!perso.length) perso=[{nom:"Ma liste", mots:""}];
    pi = Math.min(pi, perso.length-1); sauverPerso(); remplirPerso();
  };
  $("persoNom").oninput = ()=>{ perso[pi].nom = $("persoNom").value; sauverPerso();
    const o = $("persoChoix").options[pi]; if (o) o.textContent = o.textContent.replace(/^.*(?= \(\d+ mots?\)$)/, nomPerso(perso[pi])); };
  $("persoPart").onclick = ()=>{
    if (!perso[pi].mots.trim()){ $("notePerso").textContent = "⚠️ La liste est vide : écris d'abord des mots."; return; }
    const url = "https://toujourscap.com/outils/lecture-rapide-de-mots-avec-le-tachitoscope.html?nom="+encodeURIComponent(nomPerso(perso[pi]))+"&mots="+encodeURIComponent(perso[pi].mots.replace(/\s+/g," ").trim());
    const ok = ()=>{ $("notePerso").textContent = "🔗 Lien copié : collez-le dans un message. En l'ouvrant, la liste s'ajoute à « Mes listes » sur l'autre ordinateur."; };
    try{ navigator.clipboard.writeText(url).then(ok, ()=>prompt("Copiez ce lien :", url)); }catch(e){ prompt("Copiez ce lien :", url); }
  };
  remplirPerso();
  // ---------- Mes textes : plusieurs textes nommés, enregistrés sur l'ordinateur ----------
  let textes = [];
  try{ textes = JSON.parse(store.get("tachi-textes","[]")); }catch(e){ textes = []; }
  if (!Array.isArray(textes)) textes = [];
  textes = textes.filter(l=>l && typeof l.texte==="string").map(l=>({nom:String(l.nom||"").slice(0,40), texte:l.texte}));
  if (!textes.length) textes = [{nom:"Mon texte", texte:store.get("tachi-texte","Le petit chat joue dans le jardin. Il voit un oiseau sur la branche du pommier. Le chat saute, mais l'oiseau s'envole ! Alors le chat retourne dormir au soleil.")}];
  let ti = parseInt(store.get("tachi-textes-i","0"),10)||0;
  try{
    const q = new URLSearchParams(location.search), qt = q.get("texte");
    if (qt && qt.trim()){
      const qn = (q.get("titre")||"Texte partagé").slice(0,40);
      let k = textes.findIndex(l=>l.nom===qn && l.texte.trim()===qt.trim());
      if (k<0){ textes.push({nom:qn, texte:qt}); k = textes.length-1; }
      ti = k; liste = "texte"; store.set("tachi-liste","texte");
    }
  }catch(e){}
  if (ti<0 || ti>=textes.length) ti = 0;
  const nomTexte = l => l.nom.trim() || "Texte sans titre";
  function sauverTextes(){ store.set("tachi-textes", JSON.stringify(textes)); store.set("tachi-textes-i", String(ti)); }
  function majOptionTexte(){ const o = $("texteChoix").options[ti]; if (o) o.textContent = nomTexte(textes[ti]);
    $("texteSuppr").disabled = textes.length<2 && !textes[0].texte.trim(); }
  function remplirTextes(){
    const c = $("texteChoix"); c.innerHTML = "";
    textes.forEach((l,k)=>{ const o=document.createElement("option"); o.value=k; o.textContent=nomTexte(l); c.appendChild(o); });
    c.value = ti; $("texteNom").value = textes[ti].nom; $("texte").value = textes[ti].texte; majOptionTexte();
  }
  $("texteChoix").onchange = ()=>{ ti = parseInt($("texteChoix").value,10)||0; sauverTextes(); remplirTextes(); marquer(); };
  $("texteNouv").onclick = ()=>{
    textes.push({nom:"Texte "+(textes.length+1), texte:""}); ti = textes.length-1;
    sauverTextes(); remplirTextes(); marquer(); $("texteNom").select(); $("texteNom").focus();
  };
  $("texteSuppr").onclick = ()=>{
    if (!confirm("Supprimer le texte « "+nomTexte(textes[ti])+" » ?")) return;
    textes.splice(ti,1); if (!textes.length) textes=[{nom:"Mon texte", texte:""}];
    ti = Math.min(ti, textes.length-1); sauverTextes(); remplirTextes(); marquer();
  };
  $("texteNom").oninput = ()=>{ textes[ti].nom = $("texteNom").value; sauverTextes(); majOptionTexte(); };
  $("textePart").onclick = ()=>{
    if (!textes[ti].texte.trim()){ $("noteTexte").textContent = "⚠️ Le texte est vide : colle d'abord un texte."; return; }
    const url = "https://toujourscap.com/outils/lecture-rapide-de-mots-avec-le-tachitoscope.html?titre="+encodeURIComponent(nomTexte(textes[ti]))+"&texte="+encodeURIComponent(textes[ti].texte.trim());
    const ok = ()=>{ $("noteTexte").textContent = "🔗 Lien copié : collez-le dans un message. En l'ouvrant, le texte s'ajoute à « Mes textes » sur l'autre ordinateur."; };
    try{ navigator.clipboard.writeText(url).then(ok, ()=>prompt("Copiez ce lien :", url)); }catch(e){ prompt("Copiez ce lien :", url); }
  };
  remplirTextes();
  $("temps").value = store.get("tachi-temps","5");
  $("melange").checked = store.get("tachi-melange","1")==="1";

  function marquer(){
    document.querySelectorAll("#listes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===liste)));
    document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===mode)));
    document.querySelectorAll("#defis button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.d===defi)));
    $("noteDefi").textContent = defi==="minute"
      ? "L'élève lit le plus de "+U(2)+" possible en 1 minute. Une erreur ne l'arrête pas : on passe "+(ph_()?"à la phrase suivante":"au mot suivant")+". À la fin, son score s'affiche."
      : "L'élève lit le plus de "+U(2)+" possible, sans limite de temps. À la première erreur, c'est stop et le score s'affiche.";
    $("perso").style.display = liste==="perso" ? "block" : "none";
    $("texteBloc").style.display = liste==="texte" ? "block" : "none";
    document.querySelectorAll("#unites button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.u===unite)));
    document.querySelectorAll(".u1").forEach(x=>x.textContent = ph_()?"phrase":"mot");
    if (liste==="texte"){
      const n = unite==="phrases" ? piochePhrases($("texte").value).length : piocheMots($("texte").value).length;
      $("noteTexte").textContent = unite==="phrases"
        ? "Les phrases du texte s'affichent une à une ("+n+" phrase"+(n>1?"s":"")+"). Décochez « Mélanger » pour les garder dans l'ordre du texte. Les textes restent enregistrés sur cet ordinateur."
        : "L'ordinateur pioche les mots du texte au hasard, sans doublon ("+n+" mot"+(n>1?"s":"")+" différent"+(n>1?"s":"")+"). Les textes restent enregistrés sur cet ordinateur.";
    }
    $("noteMode").textContent = mode==="micro"
      ? (ph_() ? "L'élève lit la phrase à voix haute : la suivante arrive quand le micro a reconnu presque tous ses mots. L'adulte peut toujours corriger avec ✅ / ❌."
               : "L'élève lit à voix haute : le mot suivant arrive dès que le micro l'a reconnu. S'il n'a pas bien entendu, l'élève peut relire une fois. L'adulte peut toujours corriger avec ✅ / ❌.")
      : (ph_() ? "L'élève lit, l'adulte clique ✅ si la phrase est juste, ❌ si elle est fausse." : "L'élève lit, l'adulte clique ✅ si le mot est juste, ❌ s'il est faux.");
  }
  document.querySelectorAll("#listes button").forEach(b=>b.onclick=()=>{liste=b.dataset.l;store.set("tachi-liste",liste);marquer();});
  document.querySelectorAll("#defis button").forEach(b=>b.onclick=()=>{defi=b.dataset.d;store.set("tachi-defi",defi);marquer();});
  document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
    if (b.dataset.m==="micro" && !SR){ $("noteMode").textContent="⚠️ Ce navigateur ne reconnaît pas la voix : utilisez Chrome, Edge ou Firefox, ou le mode « Un adulte valide »."; return; }
    mode=b.dataset.m;store.set("tachi-mode",mode);marquer();});
  $("mots").oninput=()=>{ perso[pi].mots=$("mots").value; sauverPerso();
    const n = $("mots").value.replace(/[,;]/g," ").split(/\s+/).filter(Boolean).length;
    const o = $("persoChoix").options[pi]; if (o) o.textContent = nomPerso(perso[pi])+" ("+n+" mot"+(n>1?"s":"")+")";
    $("persoSuppr").disabled = perso.length<2 && !perso[0].mots.trim(); };
  $("texte").oninput=()=>{ textes[ti].texte=$("texte").value; sauverTextes(); majOptionTexte(); marquer(); };
  document.querySelectorAll("#unites button").forEach(b=>b.onclick=()=>{unite=b.dataset.u;store.set("tachi-unite",unite);marquer();});
  $("temps").onchange=()=>store.set("tachi-temps",$("temps").value);
  $("melange").onchange=()=>store.set("tachi-melange",$("melange").checked?"1":"0");
  marquer();

  // ---------- Comparaison de ce qui est entendu (reprise du téléprompteur à l'écoute) ----------
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").replace(/[^a-z0-9']/g,"");
  const bare = s => s.replace(/'/g,"");
  function ph(w){
    let s = bare(w);
    if (s.length<2) return s;
    s = s.replace(/^h/,"").replace(/ph/g,"f").replace(/gu(?=[eiy])/g,"g").replace(/g(?=[eiy])/g,"j")
         .replace(/qu/g,"k").replace(/c(?=[eiy])/g,"s").replace(/ck|c/g,"k").replace(/(?<=[aeiouy])s(?=[aeiouy])/g,"z")
         .replace(/eaux?|aux?|au/g,"o").replace(/[ae]i[nm](?![aeiouyn])/g,"I").replace(/ai|ei/g,"e").replace(/(er|ez|et|es)$/,"e")
         .replace(/oi/g,"W").replace(/ou/g,"U").replace(/[ae][nm](?![aeiouyn])/g,"A").replace(/o[nm](?![aeiouyn])/g,"O")
         .replace(/(ai|ei|i|u)[nm](?![aeiouyn])/g,"I").replace(/y/g,"i").replace(/h/g,"").replace(/(.)\1+/g,"$1");
    s = s.replace(/gt$/,"t").replace(/(ent|e|s|t|x|d|p)$/,"").replace(/(s|t|x|d)$/,"");
    return s || w;
  }
  function lev(a,b){
    if (Math.abs(a.length-b.length)>2) return 9;
    const d=[...Array(b.length+1).keys()];
    for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i;
      for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } }
    return d[b.length];
  }
  function pareil(entendu, cible){
    let h = norm(entendu); const t = norm(cible);
    if (!h || !t) return false;
    if (ECRITS[h]) h = norm(ECRITS[h]);
    if (h.includes("'")) h = h.split("'").pop();
    if (bare(h)===bare(t)) return true;
    if (t.length>=5 && lev(bare(h),bare(t))<=1) return true;
    if (t.length>=9 && lev(bare(h),bare(t))<=2) return true;
    const a=ph(h), b=ph(t);
    return a===b || (b.length>=4 && lev(a,b)<=1);
  }
  // Le mot est-il dans ce que le micro a entendu (l'enfant peut dire « euh… maison », ou « le chat » pour « chat ») ?
  function trouve(texte, cible){
    const toks = texte.split(/[\s\-]+/).filter(Boolean);
    const n = cible.split(/[\s\-]+/).length;
    for (let i=0;i<toks.length;i++){
      if (pareil(toks.slice(i,i+n).join(""), cible.replace(/[\s\-]/g,""))) return true;
    }
    return pareil(texte.replace(/[\s\-]/g,""), cible.replace(/[\s\-]/g,""));
  }

  // Part des mots de la phrase que le micro a entendus (dans n'importe quel ordre)
  function partPhrase(entendu, phrase){
    const cibles = phrase.replace(/[’`]/g,"'").split(/[\s\-]+/).map(w=>w.split("'").pop()).filter(w=>norm(w));
    const toks = entendu.replace(/[’`]/g,"'").split(/[\s\-]+/).filter(Boolean);
    if (!cibles.length) return 0;
    let ok = 0;
    cibles.forEach(c=>{ if (toks.some(t=>pareil(t,c))) ok++; });
    return ok / cibles.length;
  }

  // ---------- Partie ----------
  let mots=[], i=0, bons=0, erreurs=[], actif=false, tMot=null, tAnim=null, debut=0, chronoInt=null, essai=0, rec=null, ecoute=false, depuis=0;

  function charger(){
    if (liste==="texte") mots = ph_() ? piochePhrases($("texte").value) : piocheMots($("texte").value);
    else {
      const src = liste==="perso" ? $("mots").value : LISTES[liste];
      mots = src.replace(/[,;]/g," ").split(/\s+/).map(m=>m.trim()).filter(Boolean);
    }
    // les mots piochés dans un texte sont toujours tirés au hasard
    if ($("melange").checked || (liste==="texte" && !ph_())) for (let k=mots.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [mots[k],mots[j]]=[mots[j],mots[k]]; }
  }
  function msg(t,c){ $("msg").textContent=t||""; $("msg").className=c||""; }

  $("go").onclick = ()=>{
    charger();
    if (!mots.length){ $("noteMode").textContent = liste==="texte" ? "⚠️ Colle d'abord un texte dans « Mes textes »." : "⚠️ La liste est vide : écris des mots dans « Mes listes »."; return; }
    $("display").classList.toggle("phrases", ph_());
    $("reglages").classList.add("cache"); $("partie").classList.remove("cache");
    $("boutons").classList.toggle("petits", mode==="micro");
    $("aideClavier").style.display = mode==="micro" ? "none" : "";
    i=0; bons=0; erreurs=[]; essai=0; actif=true; debut=Date.now();
    $("chrono").classList.remove("vite");
    const tic=()=>{
      const e=Math.floor((Date.now()-debut)/1000);
      if (defi==="minute"){
        const reste=Math.max(0,DUREE-e);
        $("chrono").textContent="⏱️ "+reste+" s"; $("chrono").classList.toggle("vite", reste<=10);
        if (reste<=0 && actif) finir(false,"fin");
      } else $("chrono").textContent=e+" s";
    };
    clearInterval(chronoInt); tic(); chronoInt=setInterval(tic,250);
    msg(mode==="micro" ? "🎤 Lis "+(ph_()?"la phrase":"le mot")+" à voix haute." : "");
    if (mode==="micro") demarrerMicro();
    montrer();
  };
  $("stop").onclick = ()=>{ arreter(); $("partie").classList.add("cache"); $("reglages").classList.remove("cache"); };

  function montrer(){
    clearTimeout(tMot); essai=0;
    $("compteur").textContent = "✅ "+bons+(defi==="minute" && erreurs.length ? "   ❌ "+erreurs.length : "");
    $("mot").textContent = mots[i];
    depuis = resultatsVus;   // on n'écoute que ce qui est dit après l'apparition du mot
    texteEnCours = "";
    const s = parseFloat($("temps").value);
    const barre = $("barre");
    barre.style.transition="none"; barre.style.width="0";
    if (s>0){
      void barre.offsetWidth;
      barre.style.transition="width "+s+"s linear"; barre.style.width="100%";
      tMot = setTimeout(()=>{ if (actif) rater("⏱️ Temps écoulé"); }, s*1000);
    }
  }
  function juste(){
    if (!actif) return;
    const d=$("display"); d.classList.remove("ok"); void d.offsetWidth; d.classList.add("ok");
    i++; bons++;
    if (mode==="micro") msg("🎤 Lis "+(ph_()?"la phrase":"le mot")+" à voix haute.");
    suivant();
  }
  function suivant(){ if (i>=mots.length) finir(true); else montrer(); }
  // Mot faux (ou temps dépassé) : en « Sans faute » la partie s'arrête ; en « 1 minute » on passe au mot suivant
  function rater(raison){
    if (!actif) return;
    if (defi!=="minute"){ finir(false, raison); return; }
    erreurs.push(mots[i]);
    const d=$("display"); d.classList.remove("ok","ko"); void d.offsetWidth; d.classList.add("ko");
    i++;
    msg(mode==="micro" ? (ph_()?"🎤 Phrase suivante : lis-la à voix haute.":"🎤 Mot suivant : lis-le à voix haute.") : "");
    suivant();
  }
  $("juste").onclick = juste;
  $("faux").onclick = ()=>rater();
  document.addEventListener("keydown", e=>{
    if (!actif || mode==="micro") return;
    if (e.key===" "||e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); juste(); }
    else if (e.key==="x"||e.key==="X"||e.key==="ArrowLeft"){ e.preventDefault(); rater(); }
  });

  function arreter(){
    actif=false; clearTimeout(tMot); clearInterval(chronoInt);
    $("barre").style.transition="none"; $("barre").style.width="0";
    arreterMicro();
    try{ speechSynthesis.cancel(); }catch(e){}
  }
  function dire(m){
    try{ const u=new SpeechSynthesisUtterance(m); u.lang="fr-FR"; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
  }

  function finir(tout, raison){
    const minute = defi==="minute";
    const rate = (!tout && !minute) ? mots[i] : null;
    arreter();
    const n = bons, sec = Math.min(Math.round((Date.now()-debut)/1000), minute?DUREE:1e9);
    const cle = "tachi-record-"+(minute?"minute-":"")+liste+(liste==="texte"?"-"+unite:"")+(liste==="perso"?"-"+nomPerso(perso[pi]):liste==="texte"?"-"+nomTexte(textes[ti]):"")+(liste==="perso"||liste==="texte"?"-"+mots.length:"");
    const ancien = parseInt(store.get(cle,"0"),10)||0;
    const nouveau = n>ancien && n>0;
    if (nouveau) store.set(cle,String(n));
    $("compteur").textContent=""; $("chrono").textContent=""; $("chrono").classList.remove("vite");
    let h = '<div class="fin">';
    if (minute){
      if (tout) h += "🎉 <strong>SUPER BRAVO !</strong> 🎉<br>Toute la liste en "+sec+" s !<br>Tu as lu";
      else h += "⏱️ <strong>Temps écoulé !</strong><br>En 1 minute, tu as lu";
      h += '<span class="gros">'+n+'</span>'+U(n)+" juste"+(n>1?"s":"")+" !";
      if (erreurs.length){
        const liste_e = erreurs.slice(0, ph_()?3:12).map(m=>m.replace(/</g,"&lt;")).join(", ")+(erreurs.length>(ph_()?3:12)?"…":"");
        h += '<br><span class="erreurs">'+erreurs.length+" erreur"+(erreurs.length>1?"s":"")+" : "+liste_e+"</span>";
      } else h += '<br><span class="erreurs">Aucune erreur 👏</span>';
    } else {
      if (tout) h += "🎉 <strong>SUPER BRAVO !</strong> 🎉<br>Tu as lu les";
      else h += "Tu as lu";
      h += '<span class="gros">'+n+'</span>'+U(n)+" sans te tromper"+(tout?" : toute la liste ! 🏆":" !");
      h += '<br><small>en '+sec+" s</small>";
      if (rate) h += '<br><span class="rate">'+(raison?raison+" sur : ":"Erreur sur : ")+"<u>"+rate.replace(/</g,"&lt;")+"</u></span>";
    }
    const rec_n = Math.max(ancien,n);
    h += '<br><span class="record">'+(nouveau ? "⭐ Nouveau record !" : "Record"+(minute?" en 1 minute":"")+" : "+rec_n+" "+U(rec_n))+"</span>";
    h += "</div>";
    $("mot").innerHTML = h;
    msg("");
    $("boutons").classList.add("cache");
    $("stop").textContent="⚙️ Changer de liste";
    if (!$("rejouer")){
      const b=document.createElement("button"); b.id="rejouer"; b.style.background="#198754"; b.style.marginRight="10px";
      b.textContent="🔄 Rejouer"; b.onclick=()=>{ $("boutons").classList.remove("cache"); b.remove(); $("go").onclick(); };
      $("stop").before(b);
    }
    if (!tout && rate) setTimeout(()=>dire(rate),500);
    try{TDC.note({s:n,n:mots.length,g:!!tout,niv:(liste==="perso"?nomPerso(perso[pi]):liste==="texte"?nomTexte(textes[ti]):NOMS[liste]),d: minute
      ? n+" "+U(n)+" juste"+(n>1?"s":"")+" en 1 minute, "+erreurs.length+" erreur"+(erreurs.length>1?"s":"")+" · "+(liste==="perso"?nomPerso(perso[pi]):liste==="texte"?nomTexte(textes[ti]):NOMS[liste])+(mode==="micro"?" · micro":"")
      : n+" "+U(n)+" "+LU(n)+" sans erreur sur "+mots.length+" · "+(liste==="perso"?nomPerso(perso[pi]):liste==="texte"?nomTexte(textes[ti]):NOMS[liste])+(mode==="micro"?" · micro":"")})}catch(e){}
  }
  // le bouton Rejouer réaffiche les boutons de jeu
  const goOrig = $("go").onclick;
  $("go").onclick = ()=>{ $("boutons").classList.remove("cache"); const r=$("rejouer"); if(r) r.remove(); goOrig(); };

  // ---------- Micro ----------
  let resultatsVus = 0, texteEnCours = "";
  function demarrerMicro(){
    if (!SR) return;
    arreterMicro();
    rec = new SR(); rec.lang="fr-FR"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=4;
    resultatsVus = 0; depuis = 0; ecoute = true;
    rec.onresult = e=>{
      if (!actif) return;
      const cible = mots[i];
      if (ph_()){
        let dit = "";
        for (let r=depuis; r<e.results.length; r++) dit += " "+e.results[r][0].transcript;
        if (partPhrase(dit, cible) >= .8){ depuis = e.results.length; resultatsVus = depuis; juste(); }
        return;   // pas d'erreur automatique sur une phrase : l'adulte peut cliquer ❌
      }
      for (let r=Math.max(e.resultIndex,depuis); r<e.results.length; r++){
        const res = e.results[r];
        let ok = false;
        for (let a=0;a<res.length;a++) if (trouve(res[a].transcript, cible)) ok = true;
        if (ok){
          depuis = r+1; resultatsVus = Math.max(resultatsVus, r+1);
          juste(); return;
        }
        if (res.isFinal){
          depuis = r+1; resultatsVus = Math.max(resultatsVus, r+1);
          const dit = res[0].transcript.trim();
          if (!dit) continue;
          essai++;
          if (essai===1) msg("🔁 J'ai entendu « "+dit+" ». Relis le mot.","warn");
          else { rater(); return; }
        }
      }
      resultatsVus = Math.max(resultatsVus, e.results.length);
    };
    rec.onerror = e=>{
      if (e.error==="not-allowed"||e.error==="service-not-allowed"){
        ecoute=false; msg("Micro refusé par le navigateur : l'adulte valide avec ✅ / ❌.","err");
        $("boutons").classList.remove("petits");
      }
    };
    rec.onend = ()=>{ if (ecoute && actif){ resultatsVus=0; depuis=0; try{ rec.start(); }catch(_){} } };
    try{ rec.start(); }catch(_){}
  }
  function arreterMicro(){ ecoute=false; if (rec){ try{ rec.abort(); }catch(_){} rec=null; } }
})();
</script>
